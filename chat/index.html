<!doctype html><html><head><meta charset=utf8><link rel="icon" type="image/png" href="../icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HUB | SYNDEX - Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de três painéis (lista · conversa · ficha) sob uma barra azul-marinho; vira um painel por vez no celular. Visual do Syndex CRM. */
:root{
  --bg:#F2F5F2;--surface:#FFFFFF;--surface-2:#EBF0EC;--border:#DCE4DD;
  --ink:#182722;--ink-mid:#4A5A52;--ink-soft:#5B6B62;
  --navy:#25536F;--navy-deep:#173B50;--navy-soft:#E2ECF2;--navy-line:#C3D6E2;--on-navy:#FFFFFF;
  --green:#2A7040;--green-soft:#E4F3E8;--green-line:#C4E3CC;--on-green:#FFFFFF;
  --amber:#8A5E0E;--amber-soft:#F6EDD8;--amber-line:#E6D3A8;--on-amber:#FFFFFF;
  --amber-card:#FBF5E6;--amber-card-line:#E2CC93;--amber-ink:#6E4B0B;
  --danger:#B3382C;--danger-soft:#F8E6E3;
  --prop:#5E4497;--on-prop:#FFFFFF;--prop-soft:#EFEAF7;--prop-line:#D4C8E8;
  --lost:#5B6B62;--on-lost:#FFFFFF;--lost-soft:#EEF0EF;--lost-line:#D3D8D5;
  --novo-card:#FBF3E1;--cot-card:#E7F0F6;--casa-card:#E9F5EC;
  --chat-bg:#E8EEEA;--bubble-in:#FFFFFF;--bubble-out:#D7E6EF;--bubble-meta:#4A5A52;--bubble-shadow:rgba(23,59,80,.08);
  --header:#173B50;--header-ink:#DCE8EE;--header-soft:#8FB0C2;--header-hi:#FFFFFF;--header-active:rgba(255,255,255,.13);--online:#7BD393;
  --badge:#2A7040;--on-badge:#FFFFFF;--me-bg:#25536F;--me-ink:#FFFFFF;
  --route:#9DB5C4;--scrim:rgba(10,20,16,.45);--shadow:0 18px 40px -20px rgba(23,59,80,.45);
  --toast:#173B50;--toast-ink:#F2F5F2;
  --phone-frame:#1C1F23;--phone-bg:#EBEDF0;--phone-top:#FFFFFF;--phone-in:#FFFFFF;--phone-out:#DCE5EE;--phone-ink:#1C1F23;--phone-soft:#5F6670;--phone-line:#E2E4E8;--verified:#2F6FD6;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512;--surface:#16201B;--surface-2:#1C2822;--border:#2A3931;
    --ink:#E6EEE8;--ink-mid:#B4C4BA;--ink-soft:#9DB0A5;
    --navy:#86B3CE;--navy-deep:#A4C8DD;--navy-soft:#1B2C36;--navy-line:#2E4757;--on-navy:#0E1512;
    --green:#62C97F;--green-soft:#173424;--green-line:#24503A;--on-green:#0E1512;
    --amber:#E2B45F;--amber-soft:#342A15;--amber-line:#4F3F1E;--on-amber:#0E1512;
    --amber-card:#2A2314;--amber-card-line:#5A4722;--amber-ink:#E8C88A;
    --danger:#E8806F;--danger-soft:#3A201B;
    --prop:#B9A3E8;--on-prop:#0E1512;--prop-soft:#241D33;--prop-line:#3F3459;
    --lost:#9DB0A5;--on-lost:#0E1512;--lost-soft:#1A201D;--lost-line:#2F3833;
    --novo-card:#2A2314;--cot-card:#17262F;--casa-card:#13291C;
    --chat-bg:#101914;--bubble-in:#1C2822;--bubble-out:#1E3442;--bubble-meta:#A9BDC9;--bubble-shadow:rgba(0,0,0,.3);
    --header:#0A110E;--header-ink:#D5E2DA;--header-soft:#8FA89A;--header-hi:#FFFFFF;--header-active:rgba(255,255,255,.10);--online:#62C97F;
    --badge:#2A7040;--on-badge:#FFFFFF;--me-bg:#25536F;--me-ink:#FFFFFF;
    --route:#3F5E70;--scrim:rgba(0,0,0,.6);--shadow:0 18px 40px -20px rgba(0,0,0,.7);
    --toast:#E6EEE8;--toast-ink:#0E1512;
    --phone-frame:#000000;--phone-bg:#14181C;--phone-top:#1C2127;--phone-in:#232A31;--phone-out:#1E3442;--phone-ink:#E8ECEF;--phone-soft:#A3ACB5;--phone-line:#2C333A;--verified:#6FA2F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#16201B;--surface-2:#1C2822;--border:#2A3931;
  --ink:#E6EEE8;--ink-mid:#B4C4BA;--ink-soft:#9DB0A5;
  --navy:#86B3CE;--navy-deep:#A4C8DD;--navy-soft:#1B2C36;--navy-line:#2E4757;--on-navy:#0E1512;
  --green:#62C97F;--green-soft:#173424;--green-line:#24503A;--on-green:#0E1512;
  --amber:#E2B45F;--amber-soft:#342A15;--amber-line:#4F3F1E;--on-amber:#0E1512;
  --amber-card:#2A2314;--amber-card-line:#5A4722;--amber-ink:#E8C88A;
  --danger:#E8806F;--danger-soft:#3A201B;
  --prop:#B9A3E8;--on-prop:#0E1512;--prop-soft:#241D33;--prop-line:#3F3459;
  --lost:#9DB0A5;--on-lost:#0E1512;--lost-soft:#1A201D;--lost-line:#2F3833;
  --novo-card:#2A2314;--cot-card:#17262F;--casa-card:#13291C;
  --chat-bg:#101914;--bubble-in:#1C2822;--bubble-out:#1E3442;--bubble-meta:#A9BDC9;--bubble-shadow:rgba(0,0,0,.3);
  --header:#0A110E;--header-ink:#D5E2DA;--header-soft:#8FA89A;--header-hi:#FFFFFF;--header-active:rgba(255,255,255,.10);--online:#62C97F;
  --badge:#2A7040;--on-badge:#FFFFFF;--me-bg:#25536F;--me-ink:#FFFFFF;
  --route:#3F5E70;--scrim:rgba(0,0,0,.6);--shadow:0 18px 40px -20px rgba(0,0,0,.7);
  --toast:#E6EEE8;--toast-ink:#0E1512;
  --phone-frame:#000000;--phone-bg:#14181C;--phone-top:#1C2127;--phone-in:#232A31;--phone-out:#1E3442;--phone-ink:#E8ECEF;--phone-soft:#A3ACB5;--phone-line:#2C333A;--verified:#6FA2F0;
  color-scheme:dark;
}

html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.i{flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- estrutura ---------- */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:20px;min-height:60px;padding:8px 20px;background:var(--header);color:var(--header-ink)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:22px;height:30px;display:block}
.brand b{display:block;font:600 19px/1.1 var(--font-display);color:var(--header-hi)}
.brand span{font-size:12px;color:var(--header-soft)}
.nav{display:flex;gap:4px}
.nav button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--header-ink);font-weight:500;font-size:14px}
.nav button:hover{background:var(--header-active)}
.nav button[aria-current="page"]{background:var(--header-active);color:var(--header-hi);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--badge);color:var(--on-badge);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.conn{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--online);display:block}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--header-soft);background:transparent;color:var(--header-hi);display:grid;place-items:center;padding:0}
.round[aria-current="page"]{background:var(--header-active);border-color:var(--header-hi)}
.round.me{background:var(--me-bg);color:var(--me-ink);font-weight:600;font-size:14px}
#view{flex:1;min-height:0;overflow:auto;position:relative}
.tabbar{display:none}

/* ---------- botões comuns ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:var(--surface);border-color:var(--navy);color:var(--navy)}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:44px;height:44px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);display:grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.solid{background:var(--navy);color:var(--on-navy);border-radius:12px}
.icon-btn.solid:hover{filter:brightness(.94);background:var(--navy);color:var(--on-navy)}

/* ---------- etiquetas ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip.t-novo{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.t-cotacao{background:var(--navy-soft);color:var(--navy);border-color:var(--navy-line)}
.chip.t-proposta{background:var(--prop);color:var(--on-prop);border-color:var(--prop)}
.chip.t-casa{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.t-perdido{background:var(--lost-soft);color:var(--lost);border-color:var(--lost-line)}
.chip.t-none{background:var(--surface-2);color:var(--ink-mid);border-color:var(--border)}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink-mid)}
.av.sm{width:40px;height:40px;font-size:13.5px}
.t-novo .av,.av.t-novo{background:var(--amber);color:var(--on-amber)}
.t-cotacao .av,.av.t-cotacao{background:var(--navy);color:var(--on-navy)}
.t-proposta .av,.av.t-proposta{background:var(--prop);color:var(--on-prop)}
.t-casa .av,.av.t-casa{background:var(--green);color:var(--on-green)}
.t-perdido .av,.av.t-perdido{background:var(--lost);color:var(--on-lost)}

/* ---------- conversas ---------- */
.conv{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr) 350px;height:100%;min-height:0;position:relative}
.lista{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border-right:1px solid var(--border)}
.lista-topo{display:flex;flex-direction:column;gap:12px;padding:18px 18px 12px}
.lista-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lista-h h1{margin:0;font:600 26px/1.1 var(--font-display)}
.busca{position:relative}
.busca>.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.busca input{width:100%;height:44px;padding:0 12px 0 38px;border:1px solid var(--border);border-radius:12px;background:var(--bg);font-size:14px}
.busca input::placeholder,.send input::placeholder,.fld input::placeholder{color:var(--ink-soft)}
.abas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0 6px;border-bottom:1px solid var(--border)}
.aba{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;padding:7px 1px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink)}
.aba b{display:flex;align-items:center;gap:4px;font-size:15px}
.aba span{font-size:11.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.aba[aria-selected="true"]{border-bottom-color:var(--navy);color:var(--navy)}
.aba[aria-selected="true"] span{color:var(--navy);font-weight:700}
.aba.fu,.aba.fu span{color:var(--danger)}
.aba.fu[aria-selected="true"]{border-bottom-color:var(--danger)}
.aba .ic-novo{color:var(--amber)}.aba .ic-cotacao{color:var(--navy)}.aba .ic-proposta{color:var(--prop)}.aba .ic-casa{color:var(--green)}
.filtros{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 18px;border-bottom:1px solid var(--border)}
.filtros label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.filtros select{height:36px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink)}
.lista-corpo{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 16px}
.sec-h{display:flex;align-items:center;gap:6px;margin:0;padding:12px 10px 6px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.sec-h.fu{color:var(--danger)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{position:relative;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.row.t-novo{background:var(--novo-card);border-color:var(--amber-line)}
.row.t-cotacao{background:var(--cot-card);border-color:var(--cot-line,var(--navy-line))}
.row.t-proposta{background:var(--prop-soft);border-color:var(--prop-line)}
.row.t-casa{background:var(--casa-card);border-color:var(--green-line)}
.row.is-unknown{border-style:dashed;border-color:var(--route)}
.row.is-sel{box-shadow:inset 0 0 0 2px var(--navy);border-color:var(--navy)}
.row-main{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;row-gap:2px;align-items:center;padding:12px 44px 12px 12px;border:0;border-radius:12px;background:transparent;text-align:left}
.row-main .av{grid-row:span 3}
.r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.r1 b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 time{font-size:12px;color:var(--ink-soft);flex:none}
.r1 time.new{color:var(--green);font-weight:700}
.r2{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--ink-mid)}
.r2 .emp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r3{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.prev{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev.strong{color:var(--ink);font-weight:600}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.late{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:11.5px;font-weight:700;white-space:nowrap;flex:none}
.pin{position:absolute;top:6px;right:4px;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);display:grid;place-items:center;opacity:0;padding:0}
.pin:hover{background:var(--surface-2);color:var(--ink)}
.row:hover .pin,.row:focus-within .pin,.pin.on{opacity:1}
.pin.on{color:var(--green)}
@media (hover:none){.pin{opacity:1}}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 10px 10px 66px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--amber-soft)}
.ask span{flex:1 1 auto;font-size:12.5px;font-weight:600;color:var(--amber)}
.ask .btn{min-height:36px;font-size:12.5px}
.vazio{padding:28px 16px;text-align:center;color:var(--ink-soft)}

/* follow-up */
.fu-card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
.fu-card.t-novo{background:var(--novo-card);border-color:var(--amber-line)}
.fu-card.t-cotacao{background:var(--cot-card);border-color:var(--navy-line)}
.fu-card.t-proposta{background:var(--prop-soft);border-color:var(--prop-line)}
.fu-card.t-casa{background:var(--casa-card);border-color:var(--green-line)}
.fu-top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center}
.fu-top .av{grid-row:span 2}
.fu-top b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fu-top .r2{grid-column:2/4}
.fu-last{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface)}
.fu-last small{font-size:12px;color:var(--ink-soft)}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.fu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 6px;font-size:13px;color:var(--ink-mid)}
.fu-head b{color:var(--ink)}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--chat-bg)}
.chat-h{flex:none;display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 12px 8px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.chat-h .back{display:none;margin-left:-8px}
.chat-id{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.chat-nome{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chat-nome b{font-weight:600;font-size:16px}
.chat-id .sub{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-acts{display:flex;align-items:center;gap:4px;flex:none}
.ficha-btn{display:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px max(16px,3vw);display:flex;flex-direction:column;gap:6px}
.day{align-self:center;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:600;margin:6px 0}
.msg{max-width:min(68%,560px);padding:8px 12px 5px;border-radius:14px;display:flex;flex-direction:column;gap:6px}
.msg p{margin:0;overflow-wrap:anywhere}
.msg.in{align-self:flex-start;background:var(--bubble-in);box-shadow:0 1px 0 var(--bubble-shadow)}
.msg.out{align-self:flex-end;background:var(--bubble-out)}
.msg.in+.msg.out,.msg.out+.msg.in{margin-top:8px}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-soft)}
.msg.out .meta{color:var(--bubble-meta)}
.meta .i{color:var(--navy)}
.orig{font-size:12px;color:var(--bubble-meta)}
.tr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.tr-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.mini{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--navy-line);background:var(--navy-soft);color:var(--navy);font-weight:600;font-size:12.5px}
.audio{display:flex;align-items:center;gap:10px;min-width:220px}
.play{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;padding:0}
.wave{flex:1 1 auto;min-width:0;height:28px;fill:var(--route)}
.audio small{font-size:12px;color:var(--ink-soft);flex:none}
.docf{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2);border:0;color:var(--ink);text-align:left;width:100%;min-width:220px}
.docf .pdf{width:36px;height:36px;flex:none;border-radius:8px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;font-size:11px;font-weight:700}
.docf span{display:flex;flex-direction:column;min-width:0}
.docf b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docf small{font-size:12px;color:var(--ink-soft)}
.evt{align-self:center;display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--navy-line);color:var(--navy);font-size:12.5px;font-weight:600;text-align:center;max-width:100%}
.pend{width:min(470px,92%);display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--amber-card);border:1px solid var(--amber-card-line)}
.pend.right{align-self:flex-end}
.pend.center{align-self:center;background:var(--surface);border-color:var(--navy-line);box-shadow:var(--shadow)}
.pend-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--amber)}
.pend p{margin:0}
.pend .note{font-size:12px;color:var(--amber-ink)}
.pend .box{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface)}
.pend .box small{font-size:11.5px;font-weight:700;color:var(--amber-ink)}
.pend textarea{width:100%;min-height:72px;padding:8px 10px;border:1px solid var(--amber-card-line);border-radius:8px;background:var(--surface);resize:vertical}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.composer{flex:none;display:flex;flex-direction:column;gap:10px;padding:12px 18px 14px;background:var(--bg);border-top:1px solid var(--border)}
.tpl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tpl>span{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-right:4px}
.pill{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500}
.pill:hover{border-color:var(--navy);color:var(--navy)}
.pill[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:600}
.send{display:flex;align-items:center;gap:8px}
.send input{flex:1 1 auto;min-width:0;height:46px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px}
.send .go{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;padding:0}
.trad-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.nao-cad{align-self:center;width:min(440px,92%);display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--amber-soft);border:1px solid var(--amber-line)}
.nao-cad b{color:var(--amber)}

/* ficha */
.ficha{min-height:0;overflow-y:auto;background:var(--surface);border-left:1px solid var(--border)}
.f-sec{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.f-sec:first-child{border-top:0;padding-top:20px}
.f-sec h3{margin:0;font-size:14px;font-weight:600}
.f-sec .hint{font-size:12.5px;color:var(--ink-soft);margin:0}
.f-top{display:flex;flex-direction:column;gap:6px}
.f-top small{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.f-top h2{margin:0;font:600 22px/1.15 var(--font-display)}
.f-top .sub{font-size:13px;color:var(--ink-soft)}
.f-x{display:none;align-self:flex-end}
.etqs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.etq{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;text-align:left}
.etq:hover{border-color:var(--route)}
.etq[aria-pressed="true"]{border:2px solid var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:700}
.etq .ok{margin-left:auto}
.etq .c-novo{color:var(--amber)}.etq .c-cotacao{color:var(--navy)}.etq .c-proposta{color:var(--prop)}.etq .c-casa{color:var(--green)}.etq .c-perdido{color:var(--lost)}
.dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.dl dt{font-size:12px;color:var(--ink-soft)}
.dl dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.dl .full{grid-column:span 2}
.dl dd.vazio-dd{color:var(--ink-soft);font-weight:400}
.f-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lst li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--surface-2)}
.lst li:first-child{border-top:0}
.lst .tx{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.lst .tx b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst .tx small{font-size:12px;color:var(--ink-soft)}
.sq{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy)}
.sq.pdf{background:var(--danger-soft);color:var(--danger);font-size:10.5px;font-weight:700}
.st{padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st.prep{background:var(--amber-soft);color:var(--amber)}
.st.env{background:var(--navy-soft);color:var(--navy)}
.st.exp{background:var(--surface-2);color:var(--ink-mid)}
.passo{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.passo input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--green);flex:none}
.passo span{display:flex;flex-direction:column}
.passo small{font-size:12px;color:var(--ink-soft)}
.passo small.atr{color:var(--danger);font-weight:600}
.passo.done>span>span{text-decoration:line-through;color:var(--ink-soft)}
.ficha textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:13.5px;resize:vertical}
.cot-link{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.scrim{display:none}

/* ---------- páginas (contatos, indicadores, ajustes) ---------- */
.page{padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-in.narrow{max-width:760px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.page-h .tt{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.page-h h1{margin:0;font:600 30px/1.1 var(--font-display)}
.page-h p{margin:0;font-size:13.5px;color:var(--ink-soft)}
.page-h .busca{flex:0 1 320px;min-width:220px}
.page-h .busca input{background:var(--surface)}
.aviso{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber)}
.aviso b{flex:1 1 auto}
.aviso.info{background:var(--navy-soft);border-color:var(--navy-line);color:var(--navy)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);min-width:0;min-height:160px}
.kcol.over{outline:2px dashed var(--green);outline-offset:-4px}
.kcol h2{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:700}
.kcol h2 .sq{width:30px;height:30px}
.kcol h2 .n{margin-left:auto;min-width:26px;height:24px;padding:0 8px;border-radius:999px;font-size:12.5px;display:grid;place-items:center}
.k-novo .sq,.k-novo .n{background:var(--amber-soft);color:var(--amber)}
.k-cotacao .sq,.k-cotacao .n{background:var(--navy-soft);color:var(--navy)}
.k-proposta .sq,.k-proposta .n{background:var(--prop-soft);color:var(--prop)}
.k-casa .sq,.k-casa .n{background:var(--green-soft);color:var(--green)}
.k-perdido .sq,.k-perdido .n{background:var(--lost-soft);color:var(--lost)}
.kcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kcard{border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:grab}
.kcard.t-novo{background:var(--novo-card);border-color:var(--amber-line)}
.kcard.t-cotacao{background:var(--cot-card);border-color:var(--navy-line)}
.kcard.t-proposta{background:var(--prop-soft);border-color:var(--prop-line)}
.kcard.t-casa{background:var(--casa-card);border-color:var(--green-line)}
.kcard.t-perdido{background:var(--lost-soft);border-color:var(--lost-line)}
.kcard.drag{opacity:.45}
.kcard-main{width:100%;display:flex;align-items:center;gap:12px;padding:12px 12px 6px;border:0;background:transparent;text-align:left;border-radius:12px 12px 0 0}
.kcard-main .tx{display:flex;flex-direction:column;min-width:0}
.kcard-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.kcard-main small{font-size:13px;color:var(--ink-soft)}
.kcard-main em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-mid)}
.mover{display:flex;align-items:center;gap:8px;padding:0 12px 10px 64px;font-size:12px;color:var(--ink-soft)}
.mover select{height:32px;padding:0 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--ink);min-width:0}
.k-hint{font-size:12.5px;color:var(--ink-soft);margin:0}
.k-vazio{margin:0;padding:16px 8px;text-align:center;color:var(--ink-soft);font-size:12.5px;border:1px dashed var(--border);border-radius:10px}

.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--ink-soft);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;min-width:0}
.card h2{margin:0;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.card .big{font:600 42px/1.05 var(--font-display);color:var(--ink)}
.card small{font-size:12.5px;color:var(--ink-soft)}
.ind-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ind-grid>.card{flex:999 1 520px}
.ind-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card h3{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.bars{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:150px minmax(0,1fr) 32px;align-items:center;gap:12px}
.bars .lb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;min-width:0}
.bars .lb .sq{width:26px;height:26px;border-radius:7px}
.track{height:14px;border-radius:0 4px 4px 0;background:var(--surface-2);display:block;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--navy);display:block;transition:width .3s ease}
.bars .v{font-weight:700;text-align:right}
.cfg{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.cfg .tx{display:flex;flex-direction:column;gap:2px;flex:1 1 260px;min-width:0}
.cfg h2{margin:0;font-size:15px;font-weight:700}
.cfg p{margin:0;font-size:13.5px;color:var(--ink-soft)}
.cfg select,.cfg input[type="time"]{height:44px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600}
.cfg .sw{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.cfg .sw input{width:20px;height:20px;margin:0;accent-color:var(--green)}
.cfg .sub-row{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cfg.lock{background:var(--amber-soft);border-color:var(--amber-line)}
.cfg.lock h2{color:var(--amber)}
.cfg.lock p{color:var(--ink-mid)}
.tag-fixa{padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--amber);border:1px solid var(--amber-line);font-size:12.5px;font-weight:700}

/* ---------- diálogos ---------- */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);max-width:calc(100% - 24px);max-height:calc(100% - 32px)}
dialog::backdrop{background:var(--scrim)}
#dlg-cad{width:640px}
#dlg-cad[open]{display:flex;flex-direction:column}
.d-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.d-h .tx{flex:1 1 auto;display:flex;flex-direction:column;gap:4px}
.d-h h2{margin:0;font:600 23px/1.15 var(--font-display)}
.d-h small{font-size:13px;color:var(--ink-soft)}
.d-b{overflow-y:auto;padding:4px 22px 20px;display:flex;flex-direction:column;gap:16px}
.d-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--border)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>legend{font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:0}
.fld input{height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:14px;width:100%}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
.achado{padding:14px;border-radius:12px;background:var(--cot-card);border:1px solid var(--navy-line)}
.achado .fld input{background:var(--surface);border-color:var(--navy-line)}
.cnpj-row{display:flex;gap:8px}
.cnpj-row input{flex:1 1 auto}
.ok-msg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--green);margin:0}
.err-msg{font-size:12.5px;font-weight:600;color:var(--danger);margin:0}
fieldset.fld{margin:0;border:0;padding:0;gap:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--navy)}

#dlg-cot{width:680px}
.cot-form{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.cot-form .fld>label,.cot-form .fld>legend{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.cot-form select{height:44px;width:100%;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:14px}
.cot-form textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:14px;resize:vertical}
.cot-form .aviso{gap:8px 10px}
.unit{position:relative}
.unit input{padding-right:42px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-soft);pointer-events:none}
.equip{display:flex;align-items:center;gap:8px}
.equip input{width:72px;flex:none}
.equip>span{color:var(--ink-soft)}
.equip select{flex:1 1 auto;min-width:0}
.yn{display:flex;gap:6px}
.yn label{position:relative;flex:1 1 0;min-height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label:has(input:checked){background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.yn label:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
.d-f{flex-wrap:wrap}
.cot-form .fld>.lbl{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.dd{position:relative;min-width:0;flex:1 1 auto}
.dd-btn{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:14px;text-align:left}
.dd-btn:hover{border-color:var(--route)}
.dd-btn[aria-expanded="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.dd-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-val.ph{color:var(--ink-soft)}
.dd-btn .i{color:var(--ink-soft);transition:transform .15s ease}
.dd-btn[aria-expanded="true"] .i{transform:rotate(180deg)}
.dd-pop{position:absolute;left:0;top:calc(100% + 4px);z-index:20;width:max(100%,270px);max-width:calc(100vw - 48px);padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.dd-search{position:relative}
.dd-search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
.dd-search input{width:100%;height:38px;padding:0 10px 0 32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13.5px}
.dd-list{list-style:none;margin:0;padding:0;max-height:min(232px,40dvh);overflow-y:auto;display:flex;flex-direction:column}
.dd-list button{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 8px;border:0;border-radius:8px;background:transparent;text-align:left}
.dd-list button:hover,.dd-list button:focus-visible{background:var(--surface-2)}
.dd-list button[aria-selected="true"]{background:var(--navy-soft);color:var(--navy)}
.dd-chk{width:16px;flex:none;visibility:hidden;color:var(--navy)}
.dd-list [aria-selected="true"] .dd-chk{visibility:visible}
.dd-tx{display:flex;flex-direction:column;min-width:0}
.dd-tx b{font-weight:600;font-size:13.5px}
.dd-tx small{font-size:12px;color:var(--ink-soft)}
.dd-list [aria-selected="true"] .dd-tx small{color:var(--navy)}
.dd-none{margin:0;padding:8px;font-size:13px;color:var(--ink-soft)}
#dlg-resumo{width:660px}
.fol-prev{min-height:240px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2);color:var(--ink-soft);box-shadow:var(--shadow)}
.fol-prev img{display:block;width:100%;height:auto}
.fol-nota{margin:0;font-size:12.5px;color:var(--ink-soft)}
.exw{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:var(--cot-card);border:1px solid var(--navy-line)}
.exw-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy)}
.exw-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.exw .fld textarea{background:var(--surface)}
@media (max-width:560px){.exw-g{grid-template-columns:minmax(0,1fr)}}
#dlg-resumo[open]{display:flex;flex-direction:column}
.rs-cli{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.rs-cli b{font-weight:600}
.rs-cli small{font-size:12.5px;color:var(--ink-soft)}
.rs-dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.rs-dl dt{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.rs-dl dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere;white-space:pre-line}

function preview(c) {
  const m = lastMsg(c);
  if (!m) return 'Sem mensagens ainda';
  const pre = m.d === 'out' ? 'Você: ' : '';
  if (m.kind === 'audio') return `Áudio · ${m.dur}` + (m.transcript ? ` · “${m.transcript}”` : '');
  if (m.kind === 'doc') return pre + 'Documento · ' + m.file;
  if (m.d === 'in' && m.en) return m.en;
  return pre + (m.text || '');
}

/* ================= conversas ================= */
function listaBase() {
  const q = S.busca.trim().toLowerCase();
  const qd = q.replace(/\D/g, '');
  return CONVS.filter(c => c.tag !== 'perdido').filter(c => {
    if (S.fOp !== 'todas' && c.op !== S.fOp) return false;
    if (S.fModal !== 'todos' && c.modal !== S.fModal) return false;
    if (!q) return true;
    const alvo = (c.nome + ' ' + c.empresa).toLowerCase();
    return alvo.includes(q) || (qd.length >= 3 && String(c.cnpj || '').replace(/\D/g, '').includes(qd));
  });
}
function contaAba(k) {
  const base = listaBase();
  if (k === 'todas') return base.length;
  if (k === 'followup') return base.filter(isFollow).length;
  return base.filter(c => c.tag === k).length;
}

  if (!lst.length) return '<p class="vazio">Nenhuma conversa com esses filtros.</p>';
  let h = '';
  if (fix.length) h += `<h2 class="sec-h">${ic('pin', 13, 'currentColor')}Fixadas</h2><ul class="rows">${fix.map(rowHTML).join('')}</ul>`;
  if (fol.length) h += `<h2 class="sec-h fu">${ic('clock', 13)}Follow-up atrasado</h2><ul class="rows">${fol.map(rowHTML).join('')}</ul>`;
  if (rec.length) h += `<h2 class="sec-h">Recentes</h2><ul class="rows">${rec.map(rowHTML).join('')}</ul>`;
  return h;
}
function renderLista() {

function msgHTML(m, i) {
  if (m.d === 'evt') return m.cot
    ? `<button class="evt" type="button" data-act="ver-cot" data-q="${m.cot}">${ic('calc', 14)}<span>${esc(m.text)} · <u>Ver folheto</u></span></button>`
    : `<div class="evt">${ic('calc', 14)}<span>${esc(m.text)}</span></div>`;
  const ticks = m.d === 'out' ? ic('checks', 15) : '';
  const meta = `<span class="meta">${esc(m.time)}${ticks}</span>`;
  let body = '';
  if (m.kind === 'audio') {
    body = `<div class="audio"><button class="play" type="button" data-act="audio" aria-label="Ouvir áudio de ${esc(m.dur)}">${ic('play', 16)}</button>${wave()}<small>${esc(m.dur)}</small></div>
      ${m.transcript ? `<div class="tr"><span class="tr-h">Transcrição</span><span>${esc(m.transcript)}</span></div>` : ''}`;
  } else if (m.kind === 'doc') {
    body = `<button class="docf" type="button" data-act="baixar"><span class="pdf">PDF</span><span><b>${esc(m.file)}</b><small>Documento</small></span></button>`;
  } else if (m.d === 'in' && m.en) {
    body = `<p lang="en">${esc(m.en)}</p>` + (m.showTr
      ? `<div class="tr"><span class="tr-h">${ic('lang', 12)}Tradução do inglês</span><span>${esc(m.pt)}</span></div>`
      : `<button class="mini" type="button" data-act="traduzir" data-i="${i}">${ic('lang', 14)}Traduzir</button>`);
  } else if (m.d === 'out' && m.enviadoEn) {
    body = `<p lang="en">${esc(m.text)}</p><span class="orig">Você escreveu: ${esc(m.pt)}</span>`;
  } else {
    body = `<p>${esc(m.text)}</p>`;
  }
  return `<div class="msg ${m.d}">${body}${meta}</div>`;
}
function pendHTML(c) {
  const p = c.pend; if (!p) return '';
  if (p.type === 'resposta') return `<div class="pend right" role="region" aria-label="Resposta sugerida">
      <span class="pend-h">${ic('lock', 15)}Resposta sugerida a seu pedido · aguardando aprovação</span>
      <p>${esc(p.text)}</p>
      <span class="note">Nada é enviado sem a sua autorização.</span>
      <div class="acts">
        <button class="btn ghost" type="button" data-act="descartar">Descartar</button>
        <button class="btn" type="button" data-act="editar-resposta">${ic('pencil', 15)}Editar</button>
        <button class="btn primary" type="button" data-act="aprovar-resposta">${ic('check', 15)}Aprovar e enviar</button>
      </div></div>`;
  if (p.type === 'etiqueta') return `<div class="pend center" role="region" aria-label="Sugestão de etiqueta">
      <span class="pend-h">${ic('lock', 15)}Sugestão de etiqueta · só muda com sua aprovação</span>
      <div class="flow"><span class="chip t-${p.from}">${ic(TAGS[p.from].ic, 12)}${TAGS[p.from].nome}</span><span style="color:var(--ink-soft)" aria-label="para">${ic('arrow', 18)}</span><span class="chip t-${p.to}">${ic(TAGS[p.to].ic, 12)}${TAGS[p.to].nome}</span></div>
      <p>A cotação foi gerada. Mover ${esc(c.empresa)} para <b>${TAGS[p.to].aba}</b>?</p>
      <div class="acts">
        <button class="btn ghost" type="button" data-act="etq-recusar">Agora não</button>
        <button class="btn primary" type="button" data-act="etq-aprovar">${ic('check', 15)}Mudar para ${TAGS[p.to].nome}</button>
      </div></div>`;
  if (p.type === 'traducao') {
    const temTr = !!p.en;
    return `<div class="pend right" role="region" aria-label="Tradução para inglês">
      <span class="pend-h">${ic('lock', 15)}Tradução para inglês · aguardando sua aprovação</span>
      <div class="box"><small>Você escreveu</small><span>${esc(p.pt)}</span></div>
      ${p.editing
        ? `<div class="box"><label for="tr-edit"><small>Vai ser enviado (edite à vontade)</small></label><textarea id="tr-edit" lang="en">${esc(p.en || '')}</textarea></div>`
        : `<div class="box"><small>Vai ser enviado</small><span lang="en">${temTr ? esc(p.en) : 'No protótipo, só a frase de exemplo é traduzida. No app real, a tradução aparece aqui.'}</span></div>`}
      <div class="acts">
        <button class="btn ghost sm" type="button" data-act="tr-pt">Enviar em português</button>
        ${p.editing ? '' : `<button class="btn sm" type="button" data-act="tr-editar">${ic('pencil', 14)}Editar tradução</button>`}
        <button class="btn primary sm" type="button" data-act="tr-aprovar" ${temTr || p.editing ? '' : 'disabled'}>${ic('check', 14)}Aprovar e enviar</button>
      </div></div>`;
  }
  return '';
}
function chatHTML(c) {
  if (!c) return '<p class="vazio">Escolha uma conversa.</p>';
  const sub = c.unknown ? 'Número não cadastrado' : c.agente ? `${c.papel} · ${c.empresa}` : c.empresa;
  let msgs = '', dia = null;
  c.msgs.forEach((m, i) => { if (m.day !== dia) { dia = m.day; msgs += `<span class="day">${esc(dia)}</span>`; } msgs += msgHTML(m, i); });
  if (c.unknown && !c.askHidden) msgs += `<div class="nao-cad"><b>Este número ainda não está cadastrado.</b><span>Quer cadastrar como cliente novo? Os dados da empresa vêm pelo CNPJ.</span>
      <div class="acts"><button class="btn ghost" type="button" data-act="agora-nao" data-id="${c.id}">Agora não</button><button class="btn primary" type="button" data-act="cadastrar" data-id="${c.id}">${ic('userplus', 15)}Cadastrar</button></div></div>`;
  msgs += pendHTML(c);
  const tradOn = c.lang === 'en' && S.trad[c.id];
  return `<header class="chat-h">
      <button class="icon-btn back" type="button" data-act="voltar" aria-label="Voltar para a lista">${ic('back', 22)}</button>
      ${avatar(c)}
      <div class="chat-id"><div class="chat-nome"><b>${esc(c.nome)}</b>${chip(c)}</div><span class="sub">${esc(sub)}</span></div>
      <div class="chat-acts">
        <button class="btn ghost sm" type="button" data-act="cliente-ver" title="Ver como o cliente">${ic('eye', 16)}<span class="hide-md">Ver como o cliente</span></button>
        <button class="icon-btn" type="button" data-act="pdf" aria-label="Exportar conversa em PDF" title="Exportar conversa em PDF">${ic('filepdf', 19)}</button>
        <button class="btn sm ficha-btn" type="button" data-act="ficha-abrir">Ficha</button>
      </div>
    </header>
    <div class="msgs" id="msgs">${msgs}</div>
    <div class="composer">
      ${c.lang === 'en' ? `<div class="trad-row"><button class="pill" type="button" data-act="toggle-trad" aria-pressed="${!!tradOn}">${ic('lang', 14)} Traduzir o que eu escrevo para inglês</button><span>${tradOn ? 'Você sempre vê a tradução antes de enviar.' : 'Desligado: envia em português.'}</span></div>` : ''}
      <div class="tpl" role="group" aria-label="Mensagens prontas"><span>Mensagens prontas</span>${TPL.map(t => `<button class="pill" type="button" data-act="tpl" data-k="${t.k}">${t.nome}</button>`).join('')}</div>
      <form class="send" data-form="send">
        <button class="icon-btn" type="button" data-act="anexar" aria-label="Anexar arquivo">${ic('clip', 20)}</button>
        <button class="btn outline" type="button" data-act="sugerir" style="border-radius:999px;min-height:44px">${ic('bulb', 16)}<span class="hide-md">Sugerir resposta</span></button>
        <label for="msg" class="vh">Mensagem</label>
        <input id="msg" type="text" autocomplete="off" placeholder="${tradOn ? 'Escreva em português' : 'Escreva uma mensagem'}" value="${esc(S.drafts[c.id] || '')}">
        <button class="go" type="submit" aria-label="${tradOn ? 'Traduzir e revisar' : 'Enviar mensagem'}">${ic('send', 19)}</button>
      </form>
    </div>`;
}

  const top = `<div class="f-sec">${fechar}<div class="f-top"><small>${c.agente ? 'Ficha do parceiro' : 'Ficha do cliente'}</small><h2>${esc(c.empresa)}</h2>

      <span style="font-size:13px;margin-top:6px"><b style="font-weight:600">${esc(c.nome)}</b>${c.cargo ? ` <span style="color:var(--ink-soft)">· ${esc(c.cargo)}</span>` : ''}</span></div></div>`;
  if (c.agente) return top + notaHTML(c);

      `<button class="etq" type="button" data-act="etiqueta" data-tag="${k}" aria-pressed="${c.tag === k}"><span class="c-${k}">${ic(TAGS[k].ic, 16)}</span>${TAGS[k].nome}${c.tag === k ? `<span class="ok">${ic('check', 15)}</span>` : ''}</button>`).join('')}</div>
      <p class="hint">${c.tag === 'perdido' ? `Motivo: ${esc(c.motivo || MOTIVO)}. ` : ''}Ao trocar a etiqueta, a conversa muda de aba.</p></div>`;
  const st = c.cotStatus === 'gerada' ? '<span class="st env">Gerada</span>' : c.cotStatus === 'rascunho' ? '<span class="st prep">Rascunho</span>' : '';
  const cot = `<div class="f-sec"><div class="f-h"><h3>Cotação</h3>${st}</div>
      ${c.cot
        ? `<dl class="dl">${camposCot(c.cot).map(([k, n]) => { const val = valCampo(c.cot, k); return `<div class="${['produto', 'pec', 'endOrigem', 'endDestino'].includes(k) ? 'full' : ''}"><dt>${n}</dt>${val ? `<dd>${esc(val)}</dd>` : '<dd class="vazio-dd">—</dd>'}</div>`; }).join('')}</dl>`
        : `<p class="hint">${c.cotFill ? 'O cliente já passou alguns dados nesta conversa. Abra a cotação e use “Preencher pela conversa”.' : 'Nenhum dado de cotação ainda.'}</p>`}
      <button class="btn primary" type="button" data-act="gerar-cot" style="min-height:46px">${ic('calc', 17)}${c.cotStatus === 'rascunho' ? 'Continuar cotação' : 'Gerar cotação'}</button></div>`;
  const cots = `<div class="f-sec"><h3>Cotações enviadas</h3>${c.cotacoes.length ? `<ul class="lst">${c.cotacoes.map(q => q.dados
    ? `<li><button class="lst-btn" type="button" data-act="ver-cot" data-q="${q.id}"><span class="sq">${ic('calc', 16)}</span><span class="tx"><b>${esc(q.t)}</b><small>${esc(q.d)} · <span>Ver folheto</span></small></span><span class="st ${q.k}">${esc(q.s)}</span></button></li>`
    : `<li><span class="sq">${ic('calc', 16)}</span><span class="tx"><b>${esc(q.t)}</b><small>${esc(q.d)}</small></span><span class="st ${q.k}">${esc(q.s)}</span></li>`).join('')}</ul>` : '<p class="hint">Nenhuma cotação para este cliente ainda.</p>'}</div>`;
  const docs = `<div class="f-sec"><h3>Documentos da conversa</h3>${c.docs.length ? `<ul class="lst">${c.docs.map(d => `<li><span class="sq pdf">PDF</span><span class="tx"><b>${esc(d.f)}</b><small>${esc(d.d)}</small></span><button class="icon-btn" type="button" data-act="baixar" aria-label="Baixar ${esc(d.f)}">${ic('download', 17)}</button></li>`).join('')}</ul>` : '<p class="hint">Nenhum documento recebido.</p>'}</div>`;
  const passos = `<div class="f-sec"><h3>Próximos passos</h3>${c.passos.length ? c.passos.map((p, i) => `<label class="passo ${p.ok ? 'done' : ''}"><input type="checkbox" id="passo-${c.id}-${i}" data-passo="${i}" ${p.ok ? 'checked' : ''}><span><span>${esc(p.t)}</span><small class="${p.late && !p.ok ? 'atr' : ''}">${esc(p.d)}</small></span></label>`).join('') : '<p class="hint">Nenhum passo combinado.</p>'}</div>`;
  return top + etq + cot + cots + docs + passos + notaHTML(c);
}

function phoneMsgs(c) {
  let h = '', dia = null;
  c.msgs.forEach(m => {
    if (m.d === 'evt') return;
    if (m.day !== dia) { dia = m.day; h += `<span class="day">${esc(dia)}</span>`; }
    const lado = m.d === 'out' ? 'l' : 'r';
    let body;
    if (m.kind === 'audio') body = `<div class="audio"><span class="play" aria-hidden="true">${ic('play', 14)}</span>${wave()}<small>${esc(m.dur)}</small></div>`;
    else if (m.kind === 'doc') body = `<span class="docf"><span class="pdf">PDF</span><span><b>${esc(m.file)}</b><small>Documento</small></span></span>`;
    else if (m.d === 'in' && m.en) body = `<p lang="en">${esc(m.en)}</p>`;
    else body = `<p ${m.enviadoEn ? 'lang="en"' : ''}>${esc(m.text)}</p>`;
    h += `<div class="pm ${lado}">${body}<span class="meta">${esc(m.time)}</span></div>`;
  });
  return h || '<p class="vazio">Sem mensagens.</p>';
}

function toast(t) {

/* ================= ações ================= */
function enviarTexto(c, text, extra = {}) {
  c.msgs.push(Object.assign({ d: 'out', day: 'Hoje', time: agora(), text }, extra));
  c.ord = ++seq; c.unread = 0; c.dias = null; c.adiado = false;
}
function setTag(c, tag) {
  const prev = c.tag;
  if (prev === tag) return;
  c.tag = tag;
  if (tag === 'perdido') c.motivo = MOTIVO;
  if (tag === 'casa' && prev !== 'casa') S.casaSessao.push({ emp: c.empresa, quem: c.nome + ' · nesta sessão' });
  if (c.pend && c.pend.type === 'etiqueta') c.pend = null;
  toast(tag === 'perdido' ? `${c.empresa} foi para Perdidos. Motivo: ${MOTIVO.toLowerCase()}.` : `Etiqueta de ${c.empresa} alterada para ${TAGS[tag].nome}.`);
}
function abrir(id) {
  const c = conv(id); if (!c) return;
  S.sel = id; c.unread = 0; S.fichaOpen = false;
  if (S.view !== 'conversas') { S.view = 'conversas'; if (S.aba !== 'todas' && S.aba !== c.tag && !(S.aba === 'followup' && isFollow(c))) S.aba = 'todas'; }
  if (c.tag === 'perdido') S.aba = 'todas';
  if (narrow()) S.pane = 'chat';
  render();
}

function setDD(name, v) {
  const dd = document.querySelector(`.dd[data-dd="${name}"]`); if (!dd) return;
  $('#cot-' + name).value = v;
  const val = dd.querySelector('.dd-val'); val.textContent = v || 'Selecione'; val.classList.toggle('ph', !v);
  dd.querySelectorAll('[data-act="dd-pick"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === v)));
  if (name === 'incoterm') {
    const ex = $('#cot-exw');
    if (ex) { const era = ex.hidden; ex.hidden = v !== 'EXW'; if (era && !ex.hidden) { try { ex.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ok */ } } }
  }
}
function fecharDD() {
  document.querySelectorAll('.dd-pop:not([hidden])').forEach(p => {
    p.hidden = true;
    const b = p.parentElement.querySelector('.dd-btn'); if (b) b.setAttribute('aria-expanded', 'false');
  });
}
function filtraDD(input) {
  const pop = input.closest('.dd-pop');
  const q = input.value.trim().toLowerCase();
  let n = 0;
  pop.querySelectorAll('.dd-list li').forEach(li => { const ok = !q || li.textContent.toLowerCase().includes(q); li.hidden = !ok; if (ok) n++; });
  pop.querySelector('.dd-none').hidden = n > 0;
}
const MODAIS = [['mar', 'Marítimo'], ['aer', 'Aéreo'], ['rod', 'Rodoviário']];
const COT_CAMPOS = [['modal', 'Modal'], ['origem', 'Origem'], ['destino', 'Destino'], ['endOrigem', 'Endereço completo de origem'], ['endDestino', 'Endereço completo de destino'], ['produto', 'Produto'], ['valor', 'Valor da mercadoria'], ['cbm', 'CBM'], ['peso', 'Peso'], ['incoterm', 'Incoterm'], ['ncm', 'NCM'], ['equip', 'Equipamento'], ['coleta', 'Com coleta'], ['entrega', 'Com entrega'], ['pec', 'Peculiaridade na operação']];
const COT_NOMES = Object.fromEntries(COT_CAMPOS);
const ehEXW = o => !!o && o.incoterm === 'EXW';
const camposCot = o => COT_CAMPOS.filter(([k]) => (k !== 'endOrigem' && k !== 'endDestino') || ehEXW(o));
const vazioCot = () => ({ modal: '', origem: '', destino: '', endOrigem: '', endDestino: '', produto: '', valor: '', cbm: '', peso: '', incoterm: '', ncm: '', qtd: '1', equip: '', coleta: '', entrega: '', pec: '' });
const semQtd = e => /LCL|Aéreo|Rodoviário|Outro/.test(e);
function equipTxt(o) {
  if (!o.equip) return o.qtd && o.qtd !== '1' ? `${o.qtd}x [tipo a confirmar]` : '';
  return semQtd(o.equip) ? o.equip : `${o.qtd || 1}x ${o.equip}`;
}
function valCampo(o, k) {
  if (k === 'modal') return (MODAIS.find(m => m[0] === o.modal) || [])[1] || '';
  if (k === 'equip') return equipTxt(o);
  if (k === 'coleta' || k === 'entrega') return o[k] === 'sim' ? 'Sim' : o[k] === 'nao' ? 'Não' : '';
  if (k === 'cbm') return o.cbm ? `${o.cbm} m³` : '';
  if (k === 'peso') return o.peso ? `${o.peso} kg` : '';
  return o[k] || '';
}
function cotDialogHTML(c) {

      <label><input type="radio" name="cot-${k}" id="cot-${k}-nao" value="nao" ${o[k] === 'nao' ? 'checked' : ''}>Não</label></div></fieldset>`;
  return `<form id="cot-form" class="cot-form" novalidate>
    <div class="d-h">
      <div class="tx"><h2 id="cot-titulo">Gerar cotação</h2><small>${esc(c.empresa)} · ${esc(c.nome)}</small></div>

    <div class="d-b">

      <p class="ok-msg" id="cot-ok" hidden></p>
      <div class="fg">
        <fieldset class="fld s6"><legend>Modal</legend><div class="yn">${MODAIS.map(([v, n]) => `<label><input type="radio" name="cot-modal" id="cot-modal-${v}" value="${v}" ${o.modal === v ? 'checked' : ''}>${n}</label>`).join('')}</div></fieldset>
        <div class="fld s3"><label for="cot-origem">Origem</label><input id="cot-origem" type="text" autocomplete="off" placeholder="Cidade, porto ou aeroporto" value="${esc(o.origem)}"></div>
        <div class="fld s3"><label for="cot-destino">Destino</label><input id="cot-destino" type="text" autocomplete="off" placeholder="Cidade, porto ou aeroporto" value="${esc(o.destino)}"></div>
        <div class="fld s4"><label for="cot-produto">Produto</label><input id="cot-produto" type="text" autocomplete="off" placeholder="O que vai ser embarcado" value="${esc(o.produto)}"></div>
        <div class="fld s2"><label for="cot-ncm">NCM</label><input id="cot-ncm" type="text" inputmode="numeric" autocomplete="off" placeholder="0000.00.00" value="${esc(o.ncm)}"></div>
        <div class="fld s2"><label for="cot-valor">Valor da mercadoria</label><input id="cot-valor" type="text" autocomplete="off" placeholder="Ex.: USD 48.000,00" value="${esc(o.valor)}"></div>
        <div class="fld s2"><label for="cot-cbm">CBM</label><div class="unit"><input id="cot-cbm" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(o.cbm)}"><span>m³</span></div></div>
        <div class="fld s2"><label for="cot-peso">Peso</label><div class="unit"><input id="cot-peso" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(o.peso)}"><span>kg</span></div></div>

        <div class="fld s4"><span class="lbl" id="lbl-equip">Equipamento</span><div class="equip"><label class="vh" for="cot-qtd">Quantidade</label><input id="cot-qtd" type="number" min="1" inputmode="numeric" value="${esc(o.qtd)}"><span aria-hidden="true">x</span>${ddHTML('equip', EQUIPS, o.equip)}</div></div>
        <div class="exw s6" id="cot-exw" ${ehEXW(o) ? '' : 'hidden'}>

          <div class="exw-g">
            <div class="fld"><label for="cot-endOrigem">Endereço completo de origem</label><textarea id="cot-endOrigem" rows="3" placeholder="Rua, número, bairro, cidade, estado ou província, país e código postal">${esc(o.endOrigem)}</textarea></div>

function abrirCot() {
  const c = conv(S.sel);
  const d = $('#dlg-cot');
  d.innerHTML = cotDialogHTML(c);
  d.showModal();
  const f = $('#cot-origem'); if (f) f.focus();
}
function lerCot() {
  const g = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
  const r = n => { const el = document.querySelector(`input[name="${n}"]:checked`); return el ? el.value : ''; };
  return { modal: r('cot-modal'), origem: g('cot-origem'), destino: g('cot-destino'), produto: g('cot-produto'), valor: g('cot-valor'), cbm: g('cot-cbm'), peso: g('cot-peso'),
    incoterm: g('cot-incoterm'), ncm: g('cot-ncm'), qtd: g('cot-qtd') || '1', equip: g('cot-equip'), coleta: r('cot-coleta'), entrega: r('cot-entrega'), pec: g('cot-pec'),
    endOrigem: g('cot-incoterm') === 'EXW' ? g('cot-endOrigem') : '', endDestino: g('cot-incoterm') === 'EXW' ? g('cot-endDestino') : '' };
}
function gerarCotacao() {
  const c = conv(S.sel);
  const o = lerCot();
  const obrig = ['modal', 'origem', 'destino', 'produto', 'equip'].concat(ehEXW(o) ? ['endOrigem', 'endDestino'] : []);
  const falta = obrig.filter(k => !o[k]).map(k => COT_NOMES[k]);
  const err = $('#cot-err');
  if (falta.length) { err.textContent = `Preencha antes de gerar: ${falta.join(', ')}.`; err.hidden = false; return; }
  c.cot = o; c.cotStatus = 'gerada';
  const rota = `${equipTxt(o)} · ${o.origem} → ${o.destino}`;
  const h = agora();
  const q = { id: 'q' + (++seq), num: proxNum(), t: rota, d: `Gerada hoje, ${h}`, s: 'Em preparo', k: 'prep', dados: Object.assign({}, o), quando: dataHora() };
  c.msgs.push({ d: 'evt', day: 'Hoje', time: h, text: `Você gerou uma cotação · ${rota} · ${h}`, cot: q.id });
  c.cotacoes.unshift(q);
  S.cotSessao.push({ emp: c.empresa, rota, quando: `Hoje, ${h} · nesta sessão` });
  if (c.tag === 'novo') c.pend = { type: 'etiqueta', from: 'novo', to: 'cotacao' };
  $('#dlg-cot').close();
  S.fichaOpen = false; const cv = $('.conv'); if (cv) cv.classList.remove('ficha-open');
  renderChatSo();
  abrirResumo(c, q.id);
  toast('Cotação gerada. O folheto está pronto para baixar ou copiar.');
}

}

    `Cliente: ${c.empresa}${c.cnpj ? ' · CNPJ ' + c.cnpj : ''}`,
    `Contato: ${c.nome}${c.cargo ? ' · ' + c.cargo : ''}`,
    `Data: ${q.quando}`, '', ...linhas, '', 'Comercial: Tomás Soares · sales8@syndex.com.br · (47) 99266-8440'].join('\n');
}

function carregaLogo() {
  if (!logoP) logoP = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = LOGO_DATA; });
  return logoP;
}
async function fontesProntas() {
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.race([
      Promise.all(['600 40px "Fraunces"', '400 24px "IBM Plex Sans"', '600 24px "IBM Plex Sans"', '700 24px "IBM Plex Sans"'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (e) { /* segue com a fonte reserva */ }
}
const FD = '"Fraunces", Georgia, serif';
const FB = '"IBM Plex Sans", "Segoe UI", Arial, sans-serif';
function quebraLinhas(ctx, txt, maxW) {
  const out = [];
  String(txt).split('\n').forEach(par => {
    const words = par.split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(''); return; }
    let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
    out.push(line);
  });
  return out;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function espaco(ctx, v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v; }
function cabe(ctx, txt, peso, tam, min, fam, maxW) { let s = tam; ctx.font = `${peso} ${s}px ${fam}`; while (ctx.measureText(txt).width > maxW && s > min) { s -= 2; ctx.font = `${peso} ${s}px ${fam}`; } }

async function folhetoCanvas(c, q) {
  await fontesProntas();
  const logo = await carregaLogo();
  const W = 1240, H = 1754, M = 80, CW = W - 2 * M;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const C = { navy: '#173B50', navy2: '#25536F', green: '#3F9C59', ink: '#182722', soft: '#5B6B62', line: '#DCE4DD', panel: '#F2F5F2', amber: '#FBF5E6', amberLine: '#E2CC93', amberInk: '#6E4B0B', white: '#FFFFFF', pale: '#CFE0EA' };
  const d = q.dados;
  const rotulo = (t, lx, ly, cor) => { espaco(x, '2.5px'); x.fillStyle = cor || C.soft; x.font = `600 18px ${FB}`; x.fillText(t.toUpperCase(), lx, ly); espaco(x, '0px'); };
  x.textBaseline = 'alphabetic';
  x.fillStyle = C.white; x.fillRect(0, 0, W, H);

  /* cabeçalho */
  x.fillStyle = C.navy; x.fillRect(0, 0, W, 250);
  x.fillStyle = C.green; x.fillRect(0, 250, W, 10);
  x.fillStyle = C.white; x.beginPath(); x.arc(M + 62, 125, 62, 0, Math.PI * 2); x.fill();
  if (logo) x.drawImage(logo, M + 62 - 33, 125 - 45, 66, 90);
  x.textAlign = 'left';
  x.fillStyle = C.white; x.font = `600 54px ${FD}`; x.fillText('Syndex', M + 150, 122);
  x.fillStyle = C.pale; x.font = `400 25px ${FB}`; x.fillText('Logística e Gestão Aduaneira', M + 150, 164);
  x.textAlign = 'right';
  espaco(x, '3px'); x.fillStyle = C.pale; x.font = `600 21px ${FB}`; x.fillText('SOLICITAÇÃO DE COTAÇÃO', W - M, 96); espaco(x, '0px');
  x.fillStyle = C.white; x.font = `700 44px ${FB}`; x.fillText('Nº ' + q.num, W - M, 150);
  x.fillStyle = C.pale; x.font = `400 23px ${FB}`; x.fillText(q.quando, W - M, 190);
  x.textAlign = 'left';

  /* cliente */
  let y = 330;
  rotulo('Cliente', M, y);
  x.fillStyle = C.ink; cabe(x, c.empresa, 600, 44, 28, FD, CW); x.fillText(c.empresa, M, y + 54);
  const sub = [c.cnpj ? 'CNPJ ' + c.cnpj : '', c.nome + (c.cargo ? ' · ' + c.cargo : '')].filter(Boolean).join('   ·   ');
  x.fillStyle = C.soft; cabe(x, sub, 400, 24, 18, FB, CW); x.fillText(sub, M, y + 96);

  /* rota (com endereços completos quando EXW) */
  y = 470;
  const colW = (CW - 120) / 2;
  const exw = ehEXW(d);
  x.font = `400 22px ${FB}`;
  const endO = exw ? quebraLinhas(x, d.endOrigem || '—', colW - 36).slice(0, 3) : [];
  const endD = exw ? quebraLinhas(x, d.endDestino || '—', colW - 36).slice(0, 3) : [];
  const nEnd = Math.max(endO.length, endD.length);
  const panelH = exw ? 186 + nEnd * 30 : 170;
  x.fillStyle = C.panel; rr(x, M, y, CW, panelH, 22); x.fill();
  if (exw) {
    rotulo('Endereço completo', M + 36, y + 150); rotulo('Endereço completo', M + 36 + colW + 120, y + 150);
    x.font = `400 22px ${FB}`; x.fillStyle = C.ink;
    endO.forEach((l, i) => x.fillText(l, M + 36, y + 182 + i * 30));
    endD.forEach((l, i) => x.fillText(l, M + 36 + colW + 120, y + 182 + i * 30));
  }
  rotulo('Origem', M + 36, y + 52); rotulo('Destino', M + 36 + colW + 120, y + 52);
  const grande = (t, bx, by) => { const tt = t || '—'; x.fillStyle = t ? C.ink : C.soft; cabe(x, tt, 700, 40, 24, FB, colW - 36); x.fillText(tt, bx, by); };
  grande(d.origem, M + 36, y + 112); grande(d.destino, M + 36 + colW + 120, y + 112);
  const ax = M + 36 + colW + 8, ay = y + 98;
  x.strokeStyle = C.green; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(ax, ay); x.lineTo(ax + 70, ay); x.moveTo(ax + 50, ay - 18); x.lineTo(ax + 70, ay); x.lineTo(ax + 50, ay + 18); x.stroke();

  /* dados */
  y = 470 + panelH + 50;
  const linhasGrade = [[['produto', 2], ['ncm', 1]], [['modal', 1], ['equip', 1], ['incoterm', 1]], [['valor', 1], ['cbm', 1], ['peso', 1]], [['coleta', 1], ['entrega', 1]]];
  const cel = CW / 3, rowH = 108;
  linhasGrade.forEach((r, ri) => {
    let cx = M; const ry = y + ri * rowH;
    x.strokeStyle = C.line; x.lineWidth = 2; x.beginPath(); x.moveTo(M, ry); x.lineTo(M + CW, ry); x.stroke();
    r.forEach(([k, span]) => {
      rotulo(COT_NOMES[k], cx, ry + 40);
      const val = valCampo(d, k); const tt = val || '—';
      x.fillStyle = val ? C.ink : C.soft; cabe(x, tt, 600, 30, 20, FB, cel * span - 28); x.fillText(tt, cx, ry + 82);
      cx += cel * span;
    });
  });
  y += linhasGrade.length * rowH;
  x.strokeStyle = C.line; x.beginPath(); x.moveTo(M, y); x.lineTo(M + CW, y); x.stroke();

  /* peculiaridade */
  const fy = H - 250;
  y += 36;
  x.font = `400 26px ${FB}`;
  const maxL = Math.max(1, Math.floor((fy - 34 - y - 104) / 38));
  let pl = quebraLinhas(x, d.pec || 'Nenhuma informada.', CW - 72);
  if (pl.length > maxL) { pl = pl.slice(0, maxL); pl[maxL - 1] = pl[maxL - 1].replace(/\s*\S*$/, '') + '…'; }
  const ph = 84 + pl.length * 38 + 20;
  x.fillStyle = C.amber; rr(x, M, y, CW, ph, 20); x.fill();
  x.strokeStyle = C.amberLine; x.lineWidth = 2; rr(x, M, y, CW, ph, 20); x.stroke();
  rotulo('Peculiaridade na operação', M + 36, y + 50, C.amberInk);
  x.fillStyle = d.pec ? C.ink : C.soft; x.font = `400 26px ${FB}`;
  pl.forEach((ln, i) => x.fillText(ln, M + 36, y + 96 + i * 38));

  /* rodapé */
  x.strokeStyle = C.line; x.lineWidth = 2; x.beginPath(); x.moveTo(M, fy); x.lineTo(M + CW, fy); x.stroke();
  rotulo('Comercial', M, fy + 52);
  x.fillStyle = C.ink; x.font = `600 38px ${FD}`; x.fillText('Tomás Soares', M, fy + 102);
  x.fillStyle = C.soft; x.font = `400 24px ${FB}`; x.fillText('sales8@syndex.com.br   ·   (47) 99266-8440', M, fy + 144);
  x.textAlign = 'right';
  x.fillStyle = C.navy2; x.font = `600 24px ${FB}`; x.fillText('Syndex Logística e Gestão Aduaneira', W - M, fy + 102);
  x.fillStyle = C.soft; x.font = `400 22px ${FB}`; x.fillText('Itajaí · SC', W - M, fy + 140);
  x.textAlign = 'left';
  x.fillStyle = C.navy; x.fillRect(0, H - 64, W, 64);
  x.fillStyle = C.pale; x.font = `400 20px ${FB}`; x.fillText(`Uso interno · gerado no Syndex Chat em ${q.quando}`, M, H - 25);
  return cv;
}

async function abrirResumo(c, qid) {
  const q = c.cotacoes.find(x => x.id === qid); if (!q || !q.dados) return;
  S.resumoTxt = resumoTexto(c, q);
  S.folheto = { c, q, canvas: null };
  const d = $('#dlg-resumo');
  d.innerHTML = `<div class="d-h">
      <div class="tx"><h2 id="rs-titulo">Folheto da solicitação</h2><small>Nº ${esc(q.num)} · ${esc(q.t)}</small></div>
      <button class="icon-btn" type="button" data-act="resumo-fechar" aria-label="Fechar">${ic('x', 20)}</button>
    </div>
    <div class="d-b">
      <div class="fol-prev" id="fol-prev"><span>Montando o folheto…</span></div>
      <p class="fol-nota" id="fol-nota" hidden></p>
      <label for="resumo-txt" class="vh">Texto do resumo</label>
      <textarea id="resumo-txt" class="rs-txt" readonly hidden>${esc(S.resumoTxt)}</textarea>
    </div>
    <div class="d-f">
      <button class="btn ghost" type="button" data-act="resumo-fechar">Fechar</button>
      <button class="btn" type="button" data-act="copiar-resumo" id="btn-copiar">${ic('docok', 15)}Copiar texto</button>
      <button class="btn" type="button" data-act="baixar-img" id="btn-img" disabled>${ic('download', 15)}Baixar imagem</button>
      <button class="btn primary" type="button" data-act="baixar-pdf" id="btn-pdf" disabled>${ic('filepdf', 15)}Baixar PDF</button>
    </div>`;
  if (!d.open) d.showModal();
  const cv = await folhetoCanvas(c, q);
  if (!S.folheto || S.folheto.q !== q) return;
  S.folheto.canvas = cv;
  const prev = $('#fol-prev');
  if (prev) prev.innerHTML = `<img src="${cv.toDataURL('image/png')}" alt="Folheto da solicitação de cotação Nº ${esc(q.num)} para ${esc(c.empresa)}">`;
  const dl = await dlPromise;
  const nota = $('#fol-nota'), bi = $('#btn-img'), bp = $('#btn-pdf');
  if (dl) {
    if (bi) bi.disabled = false;
    if (bp) bp.disabled = !window.jspdf;
    if (!window.jspdf && nota) { nota.textContent = 'O gerador de PDF não carregou agora. A imagem continua disponível para baixar.'; nota.hidden = false; }
  } else if (nota) {
    nota.textContent = 'Os botões de baixar funcionam quando o protótipo é aberto pelo link do Claude. O texto pode ser copiado em qualquer lugar.';
    nota.hidden = false;
  }
}
function nomeArquivo(c, q, ext) {
  const base = `Solicitacao de cotacao ${q.num.replace('/', '-')} - ${c.empresa}`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w .-]+/g, '').replace(/\s+/g, ' ').trim();
  return base + '.' + ext;
}
async function salvarArquivo(filename, data) {
  const dl = await dlPromise;
  if (!dl) { toast('Os downloads funcionam quando o protótipo é aberto pelo link do Claude.'); return; }
  try { await dl.save({ filename, data }); toast('Folheto salvo.'); }
  catch (e) {
    const code = e && e.code;
    if (code === 'declined') toast('Download cancelado.');
    else if (code === 'rate_limited') toast('Já tem um download esperando sua confirmação.');
    else toast('Não deu para baixar o arquivo aqui.');
  }
}

/* ================= cadastro ================= */
function abrirCadastro(id) {
  S.cadCtx = id; S.cadBuscou = false;
  const c = id ? conv(id) : null;
  ['cad-cnpj', 'cad-razao', 'cad-cidade', 'cad-uf', 'cad-nome', 'cad-cargo', 'cad-email'].forEach(k => { $('#' + k).value = ''; });
  ['cad-imp', 'cad-exp', 'cad-mar', 'cad-aer', 'cad-rod'].forEach(k => { $('#' + k).checked = false; });
  $('#cad-ok').hidden = true; $('#cad-err').hidden = true;
  $('#cad-origem').textContent = c ? `Número ${c.nome} · mensagem recebida hoje, ${lastMsg(c).time}` : 'Novo contato da sua carteira';
  const x = document.querySelector('#dlg-cad [data-act="cad-fechar"].icon-btn'); if (x) x.innerHTML = ic('x', 20);
  document.querySelector('[data-act="cad-buscar"]').innerHTML = ic('search', 15) + 'Buscar dados';
  $('#cad-salvar').innerHTML = ic('check', 15) + 'Salvar cadastro';
  $('#dlg-cad').showModal();
  $('#cad-cnpj').focus();
}
function salvarCadastro() {
  const razao = $('#cad-razao').value.trim();
  const nome = $('#cad-nome').value.trim();
  const err = $('#cad-err');
  if (!razao) { err.textContent = 'Busque os dados pelo CNPJ ou preencha a razão social.'; err.hidden = false; return; }
  if (!nome) { err.textContent = 'Preencha o nome do contato.'; err.hidden = false; $('#cad-nome').focus(); return; }
  const op = $('#cad-imp').checked ? 'imp' : $('#cad-exp').checked ? 'exp' : null;
  const modal = $('#cad-mar').checked ? 'mar' : $('#cad-aer').checked ? 'aer' : $('#cad-rod').checked ? 'rod' : null;
  const cidade = [$('#cad-cidade').value.trim(), $('#cad-uf').value.trim().toUpperCase()].filter(Boolean).join(', ');
  const ini = nome.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
  let c = S.cadCtx ? conv(S.cadCtx) : null;
  if (!c) {
    c = { id: 'c' + (++seq), msgs: [], unread: 0, dias: null, ord: seq, cotacoes: [], docs: [], passos: [], nota: '' };
    CONVS.push(c);
  }
  Object.assign(c, { unknown: false, askHidden: true, nome, ini, empresa: razao, cargo: $('#cad-cargo').value.trim(), cnpj: $('#cad-cnpj').value.trim() || '[CNPJ]', cidade: cidade || '[CIDADE]', tag: 'novo', op, modal });
  if (!c.sug) c.sug = `Obrigado pelo contato, ${nome.split(' ')[0]}! Vou verificar e te retorno em seguida.`;
  $('#dlg-cad').close();
  S.sel = c.id;
  toast('Cadastro salvo. O contato entrou em Clientes novos.');
  render();
}

/* ================= eventos ================= */
document.addEventListener('click', e => {
  if (!e.target.closest('.dd')) fecharDD();
  const d = $('#dlg-phone');
  if (e.target === d) { d.close(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.matches('[data-form="send"]')) {
    e.preventDefault();
    const c = conv(S.sel);
    const inp = $('#msg');
    const text = (inp ? inp.value : '').trim();
    if (!text) { if (inp) inp.focus(); return; }
    S.drafts[c.id] = '';
    if (c.lang === 'en' && S.trad[c.id]) {
      c.pend = { type: 'traducao', pt: text, en: TRADUCOES[text] || '' };
      renderChatSo();
      return;
    }
    enviarTexto(c, text);
    renderChatSo();
    focaMsg();
  } else if (e.target.id === 'cad-form') {
    e.preventDefault(); salvarCadastro();
  } else if (e.target.id === 'cot-form') {
    e.preventDefault(); gerarCotacao();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'msg') S.drafts[S.sel] = t.value;
  else if (t.id === 'busca') { S.busca = t.value; renderLista(); }
  else if (t.id === 'busca-c') { S.buscaC = t.value; const k = $('#kanban'); if (k) k.innerHTML = colunasHTML(); }
  else if (t.id === 'nota') conv(S.sel).nota = t.value;
  else if (t.id === 'tr-edit') { const c = conv(S.sel); if (c.pend) c.pend.en = t.value; }
  else if (t.dataset.ddSearch) filtraDD(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-op') { S.fOp = t.value; renderLista(); }
  else if (t.id === 'f-modal') { S.fModal = t.value; renderLista(); }
  else if (t.dataset.mover) { setTag(conv(t.dataset.mover), t.value); render(); }
  else if (t.dataset.passo != null) { const c = conv(S.sel); const p = c.passos[+t.dataset.passo]; p.ok = t.checked; const f = $('#ficha'); if (f) f.innerHTML = fichaHTML(c); }
  else if (t.id === 'cfg-dias') { S.cfg.followDays = +t.value; renderNav(); toast(`Follow-up: lembrar depois de ${t.value} dias sem resposta.`); }
  else if (t.id === 'cfg-resumo') { S.cfg.resumo = t.checked; render(); toast(t.checked ? 'Resumo da manhã ligado.' : 'Resumo da manhã desligado.'); }
  else if (t.id === 'cfg-hora') { S.cfg.hora = t.value || '08:00'; toast(`Resumo às ${S.cfg.hora}.`); }
  else if (t.id === 'ph-selo') { S.phone.selo = t.checked; $('#dlg-phone').innerHTML = phoneHTML(); }
});
/* arrastar e soltar nos contatos */
let arrastando = null;
document.addEventListener('dragstart', e => {
  const k = e.target.closest && e.target.closest('[data-drag]');
  if (!k) return;
  arrastando = k.dataset.drag; k.classList.add('drag');
  try { e.dataTransfer.setData('text/plain', arrastando); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ok */ }
});
document.addEventListener('dragend', e => { const k = e.target.closest && e.target.closest('[data-drag]'); if (k) k.classList.remove('drag'); document.querySelectorAll('.kcol.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !arrastando) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(x => { if (x !== col) x.classList.remove('over'); }); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-col]');
  if (!col || !arrastando) return;
  e.preventDefault();
  const c = conv(arrastando); arrastando = null;
  if (c) setTag(c, col.dataset.col);
  render();
});
document.addEventListener('keydown', e => {
  const pop = document.querySelector('.dd-pop:not([hidden])');
  if (pop) {
    if (e.key === 'Escape') { e.preventDefault(); const b = pop.parentElement.querySelector('.dd-btn'); fecharDD(); if (b) b.focus(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const opts = Array.from(pop.querySelectorAll('.dd-list li:not([hidden]) button'));
      if (!opts.length) return;
      e.preventDefault();
      const i = opts.indexOf(document.activeElement);
      const n = e.key === 'ArrowDown' ? (i < 0 ? 0 : Math.min(i + 1, opts.length - 1)) : i - 1;
      if (n < 0) pop.querySelector('[data-dd-search]').focus(); else opts[n].focus();
      return;
    }
    if (e.key === 'Enter' && e.target.matches('[data-dd-search]')) {
      e.preventDefault();
      const first = pop.querySelector('.dd-list li:not([hidden]) button'); if (first) first.click();
      return;
    }
  }
  if (e.key === 'Escape' && S.fichaOpen) A['ficha-fechar']();
});
$('#dlg-cot').addEventListener('cancel', e => { if (document.querySelector('.dd-pop:not([hidden])')) { e.preventDefault(); fecharDD(); } });
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.cfg.tema === 'sistema') renderNav(); });
  window.matchMedia('(max-width: 899px)').addEventListener('change', ev => { if (!ev.matches) S.pane = 'list'; if (S.view === 'conversas') render(); });
} catch (e) { /* navegador antigo */ }

aplicaTema();
conv(S.sel).unread = 0;
render();
})();
</script>
