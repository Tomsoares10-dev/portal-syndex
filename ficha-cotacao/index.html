<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNDEX | Ficha de cotação</title>
<link rel="icon" type="image/png" href="../icon-192.png">
<meta name="description" content="Responda só o que vale para a sua carga e envie a ficha de cotação para a Syndex pelo WhatsApp ou por e-mail.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#173B50">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Syndex Logística e Gestão Aduaneira">
<meta property="og:title" content="Ficha de cotação | Syndex">
<meta property="og:description" content="Importação ou exportação, marítimo, aéreo ou rodoviário: responda só o que vale para a sua carga e envie para a Syndex.">
<meta property="og:url" content="https://tomsoares10-dev.github.io/portal-syndex/ficha-cotacao/">
<meta property="og:image" content="https://tomsoares10-dev.github.io/portal-syndex/ficha-cotacao/preview.jpg?v=1">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: faixa da marca com ilustração no topo e um único cartão de assistente, centralizado: barra de etapas, uma pergunta por tela e navegação Voltar/Próximo; no fim, o resultado em abas */
:root{--bg:#F3F5F3;--surface:#FFFFFF;--surface-2:#EEF2EF;--border:#DDE5DF;--ink:#14231D;--ink-soft:#5A6A61;--navy:#25536F;--navy-deep:#173B50;--navy-soft:#E5EEF3;--green:#3F9C59;--green-ink:#2E7A45;--green-soft:#E6F4EA;--warn:#9A6B00;--warn-line:#C99A2E;--warn-soft:#FFF5DA;--danger:#B3382C;--danger-soft:#FBEAE7;--on-accent:#FFFFFF;--hero-a:#123246;--hero-b:#25536F;--chat:#ECEFE9;--bubble:#DFF3DC;--shadow:0 1px 2px rgba(20,35,29,.05),0 10px 28px -16px rgba(20,35,29,.22);--radius:16px;--font-display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
html[data-tema="escuro"]{color-scheme:dark;--bg:#0D1411;--surface:#151F1A;--surface-2:#1B2721;--border:#283730;--ink:#E7EEE9;--ink-soft:#9DB0A4;--navy:#86B3CE;--navy-deep:#5C87A3;--navy-soft:#16262F;--green:#5FCB7C;--green-ink:#7BD896;--green-soft:#15301F;--warn:#E8C060;--warn-line:#C99A2E;--warn-soft:#352C13;--danger:#E2776A;--danger-soft:#3A1C18;--on-accent:#0D1411;--hero-a:#0A1C27;--hero-b:#173B50;--chat:#101915;--bubble:#1D3A28;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg{flex:none}
.wrap{max-width:960px;margin:0 auto;padding:18px}

/* faixa da marca com ilustração */
.band{position:relative;overflow:hidden;border-radius:16px;padding:20px 24px 22px;background:linear-gradient(115deg,var(--hero-a) 0%,var(--hero-a) 45%,var(--hero-b) 100%);color:#fff;box-shadow:var(--shadow);min-height:168px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#3F9C59 0%,#3F9C59 30%,#2E6E8F 100%)}
.band .art{position:absolute;right:8px;bottom:3px;height:calc(100% - 50px);width:56%;max-width:480px;pointer-events:none}
.band .top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.band .logo{background:#fff;border-radius:8px;padding:5px 8px;display:flex}
.band .logo img{height:26px;display:block}
.band .side{display:flex;gap:8px;align-items:center}
.band .tt{position:relative;z-index:1;max-width:52%}
.band .eyebrow{margin:0 0 4px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.66);font-weight:600}
.band h1{margin:0;font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.band .sub{margin:6px 0 0;font-size:13.5px;color:rgba(255,255,255,.75)}
.badge{font-family:var(--font-mono);font-size:11.5px;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:4px 9px;color:rgba(255,255,255,.85);white-space:nowrap;background:rgba(10,28,39,.35)}
.ghost{background:rgba(10,28,39,.35);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.ghost:hover{background:rgba(255,255,255,.12)}

/* movimento do topo */
.art .ship{transform-box:fill-box;transform-origin:50% 100%;animation:balanco 5.5s ease-in-out infinite}
.art .wave.w1{animation:mar 7s linear infinite}
.art .wave.w2{animation:mar 10s linear infinite reverse}
.art .truck{animation:estrada 11s linear infinite}
.art .plane{animation:voo 13s ease-in-out infinite}
.art .route{animation:fluxo 2.4s linear infinite}
@keyframes balanco{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.2px) rotate(-.7deg)}}
@keyframes mar{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes estrada{0%{transform:translateX(-34px);opacity:0}10%{opacity:1}82%{opacity:1}100%{transform:translateX(34px);opacity:0}}
@keyframes voo{0%{transform:translate(-40px,12px);opacity:0}12%{opacity:.95}80%{opacity:.95}100%{transform:translate(22px,-8px);opacity:0}}
@keyframes fluxo{to{stroke-dashoffset:-15}}

/* selo de conclusão */
.pronto{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px 18px;border:1px solid var(--green);background:var(--green-soft);border-radius:14px;margin:16px 0 4px;animation:surge .35s ease-out}
.pronto .selo{color:var(--green-ink);width:96px;height:96px;flex:none;transform:rotate(-10deg);animation:carimbo .6s cubic-bezier(.2,1.5,.4,1) both}
.pronto div{flex:1;min-width:200px}
.pronto b{display:block;font-size:16px;margin-bottom:2px}
.pronto p{margin:0 0 10px;font-size:14px;color:var(--ink-soft)}
@keyframes carimbo{0%{transform:scale(1.9) rotate(-28deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ficha .pend.ok b{color:var(--green-ink)}

/* formulário do cliente */
.fsec + .fsec{margin-top:22px;padding-top:20px;border-top:1px solid var(--border)}
.fsec > h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.fsec > h3 svg{color:var(--navy)}
.form.c3{grid-template-columns:1fr 1fr 1fr}
.form.addr{grid-template-columns:150px 2fr 90px 1.2fr 1.3fr 70px}
.fstat{font-size:12.5px;margin:0;min-height:1.2em;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink-soft)}
.fstat.ok{color:var(--green-ink)}
.fstat.err{color:var(--danger)}
.fstat a{color:var(--navy);font-weight:600}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:gira .7s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
.field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.field input.mono{font-family:var(--font-mono);letter-spacing:.02em}
.envnote{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;font-size:13.5px;border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;margin:-8px 0 20px;background:color-mix(in srgb,var(--navy-soft) 55%,var(--surface))}
.envnote.on{border-left-color:var(--green);background:var(--green-soft)}
.envnote p{margin:0;flex:1;min-width:200px}
.envnote a{color:var(--navy);font-weight:600;white-space:nowrap}
.rf{margin-top:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:surge .3s ease-out}
.rf-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:color-mix(in srgb,var(--surface-2) 60%,var(--surface));border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.rf-h span:first-child{display:inline-flex;align-items:center;gap:7px}
.sit{font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.sit.ok{background:var(--green-soft);color:var(--green-ink)}
.sit.bad{background:var(--danger-soft);color:var(--danger)}
.rf dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 14px;padding:12px 14px;font-size:13.5px}
.rf dt{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:1px}
.rf dd{margin:0;min-width:0;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.field label small{text-transform:none;letter-spacing:0;font-weight:400}
.field input,.field textarea,.obs-ta{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.field textarea,.obs-ta{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.obs-ta:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.field .hint,.obs .hint{font-size:12px;color:var(--ink-soft);margin:0}
.lock{display:inline-flex;align-items:center;gap:5px}
.note{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--border);border-radius:12px;padding:12px 14px;margin-bottom:22px;background:color-mix(in srgb,var(--surface-2) 50%,var(--surface))}
.note .ni{color:var(--navy);margin-top:2px}
.note b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.note p{margin:0;font-size:14px;white-space:pre-wrap}
.obs{margin-top:24px}

/* assistente */
.wiz{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.stepper{list-style:none;margin:0;padding:20px 18px 18px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.stepper li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.stepper li + li::before{content:"";position:absolute;top:15px;right:calc(50% + 20px);left:calc(-50% + 20px);height:2px;background:var(--border);border-radius:2px}
.stepper li.done::before,.stepper li.cur::before{background:var(--green)}
.stepper button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;max-width:100%}
.stepper .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px;border:2px solid var(--border);background:var(--surface);color:var(--ink-soft);transition:all .2s}
.stepper .done .c{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.stepper .cur .c{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;box-shadow:0 0 0 4px var(--navy-soft)}
html[data-tema="escuro"] .stepper .cur .c{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.stepper .l{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.stepper .cur .l,.stepper .done .l{color:var(--ink)}
.stepper .v{font-size:12px;color:var(--ink-soft);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.stepper .done .v{color:var(--green-ink);font-weight:500}

.stage{padding:26px 30px 28px;min-height:420px}
.stage.fwd{animation:daDireita .34s cubic-bezier(.2,.75,.25,1)}
.stage.back{animation:daEsquerda .34s cubic-bezier(.2,.75,.25,1)}
@keyframes daDireita{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes daEsquerda{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.q{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.25;letter-spacing:-.015em;margin:0;text-wrap:balance}
.qs{margin:6px 0 22px;color:var(--ink-soft);font-size:14.5px;max-width:62ch}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.wnav .pos{font-size:12.5px;color:var(--ink-soft)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);transition:filter .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--navy)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.nav{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
html[data-tema="escuro"] .btn.nav{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.pri:hover,.btn.nav:hover{filter:brightness(1.07)}
.btn[hidden]{display:none}
.btn.invis{visibility:hidden}

/* cartões de escolha */
.choice{position:relative;border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;text-align:left;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,background .15s,box-shadow .15s}
.choice:hover{border-color:var(--navy)}
.choice .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--navy);flex:none;transition:background .15s,color .15s}
.choice b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.choice small{display:block;font-size:13px;color:var(--ink-soft);line-height:1.4}
.choice[aria-pressed="true"]{border-color:var(--navy-deep);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy-deep)}
html[data-tema="escuro"] .choice[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.choice[aria-pressed="true"] .ico{background:var(--navy-deep);color:#fff}
html[data-tema="escuro"] .choice[aria-pressed="true"] .ico{background:var(--navy);color:var(--on-accent)}
.choice .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--green);color:var(--on-accent);display:none;place-items:center}
.choice[aria-pressed="true"] .tick{display:grid}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.gc .choice{padding:12px;gap:11px;align-items:center}
.gc .choice .ico{width:38px;height:38px;border-radius:10px}
.gc .choice b{font-size:14.5px}
.gc .choice small{font-size:12px}
.g3 .choice{flex-direction:column;align-items:flex-start}
.glabel{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);margin:0 0 9px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.glabel::after{content:"";flex:1;height:1px;background:var(--border)}
.incg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}
.incc{border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;transition:border-color .15s,background .15s}
.incc:hover{border-color:var(--navy)}
.incc .k{font-family:var(--font-mono);font-weight:600;font-size:17px;letter-spacing:.05em}
.incc .n{font-size:12px;color:var(--ink-soft);line-height:1.3}
.incc[aria-pressed="true"]{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.incc[aria-pressed="true"] .n{color:rgba(255,255,255,.78)}
html[data-tema="escuro"] .incc[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
html[data-tema="escuro"] .incc[aria-pressed="true"] .n{color:rgba(13,20,17,.75)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline;border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--surface-2) 50%,var(--surface));font-size:14px}
.detail .t{grid-column:1/-1;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.detail dt{color:var(--ink-soft);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.detail dd{margin:0}
.code{font-family:var(--font-mono);font-weight:600;letter-spacing:.04em;background:var(--navy-deep);color:#fff;border-radius:7px;padding:2px 8px}
html[data-tema="escuro"] .code{background:var(--navy);color:var(--on-accent)}

/* alertas */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--border);border-left-width:4px;margin-top:16px}
.alert .ai{margin-top:1px}
.alert p{margin:0;flex:1;min-width:200px;font-size:14px}
.alert.warn{border-left-color:var(--warn-line);background:var(--warn-soft)}
.alert.warn .ai{color:var(--warn)}
.alert.info{border-left-color:var(--navy);background:color-mix(in srgb,var(--navy-soft) 60%,var(--surface))}
.alert.info .ai{color:var(--navy)}
.alert.stop{border-left-color:var(--danger);background:var(--danger-soft)}
.alert.stop .ai{color:var(--danger)}

/* resultado */
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rtop h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.rtop span{font-size:12.5px;color:var(--ink-soft)}
.rtop .cli{width:100%;margin:-6px 0 0;font-size:14px;color:var(--ink-soft)}
.rtop .cli b{color:var(--ink);font-weight:600}
.ficha{display:grid;grid-template-columns:1fr 1.35fr 1fr 1.35fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ficha > div{padding:11px 14px;min-width:0}
.ficha > div + div{border-left:1px solid var(--border)}
.ficha > div > span:first-child{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
.ficha b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;line-height:1.3}
.ficha b small{font-weight:400;color:var(--ink-soft);font-size:12.5px}
.ficha .code{font-size:12.5px;padding:1px 6px}
.ficha .pend b{color:var(--green-ink)}
.mail{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mail-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.mail-h .to{font-size:13px;color:var(--ink-soft)}
.mail-h .to b{color:var(--ink);font-weight:600}
.seg2{display:inline-flex;border:1px solid var(--border);border-radius:9px;padding:2px;background:var(--surface)}
.seg2 button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--navy-deep);color:#fff}
html[data-tema="escuro"] .seg2 button[aria-pressed="true"]{background:var(--navy);color:var(--on-accent)}
.mail textarea{display:block;width:100%;border:0;background:var(--surface);resize:none;line-height:1.6;font-size:14px;padding:16px 18px;min-height:200px;overflow:hidden}
.mail textarea:focus{outline:none}
.mail:focus-within{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

/* ---------- CNPJ e CEP ---------- */
const soCnpj=v=>v.toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,14);
function fmtCnpj(r){let o=r.slice(0,2);if(r.length>2)o+="."+r.slice(2,5);if(r.length>5)o+="."+r.slice(5,8);if(r.length>8)o+="/"+r.slice(8,12);if(r.length>12)o+="-"+r.slice(12,14);return o;}
function cnpjValido(r){
  if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(r)||/^(\d)\1{13}$/.test(r)) return false;
  const dv=s=>{let w=2,sum=0;for(let i=s.length-1;i>=0;i--){sum+=(s.charCodeAt(i)-48)*w;w=w===9?2:w+1;}const m=sum%11;return m<2?0:11-m;};
  const d1=dv(r.slice(0,12)), d2=dv(r.slice(0,12)+d1); return r.slice(12)===`${d1}${d2}`;
}
const soCep=v=>v.replace(/\D/g,"").slice(0,8);
const fmtCep=d=>d.length>5?d.slice(0,5)+"-"+d.slice(5):d;
function fmtTel(d){d=(d||"").replace(/\D/g,"");if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;return d;}
function tc(s){
  const keep={LTDA:"Ltda.",SA:"S.A.","S.A":"S.A.","S/A":"S/A",ME:"ME",EPP:"EPP",EIRELI:"EIRELI",MEI:"MEI",SC:"SC",SP:"SP",RJ:"RJ"};
  const low=["de","da","do","das","dos","e","em","na","no"];
  return (s||"").toLowerCase().split(/\s+/).filter(Boolean).map((w,i)=>{const u=w.toUpperCase().replace(/\.$/,"");if(keep[u])return keep[u];if(i>0&&low.includes(w))return w;return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
}
async function tenta(fontes){
  let bloq=0,nao=0;
  for(const [url,norm] of fontes){
    let r; try{r=await fetch(url);}catch(e){bloq++;continue;}
    if(r.ok){let j;try{j=await r.json();}catch(e){continue;}const out=norm(j);if(out)return out;nao++;continue;}
    if(r.status===404||r.status===400)nao++;
  }
  if(nao) throw "nao"; if(bloq===fontes.length) throw "bloq"; throw "erro";
}

const normWs=d=>{if(!d||!d.razao_social)return null;const e=d.estabelecimento||{};return {razao:d.razao_social,fantasia:e.nome_fantasia||"",situacao:e.situacao_cadastral||"",cnae:(e.atividade_principal||{}).descricao||"",abertura:e.data_inicio_atividade||"",logradouro:semDup(e.tipo_logradouro,e.logradouro),numero:String(e.numero||""),complemento:e.complemento||"",bairro:e.bairro||"",cidade:(e.cidade||{}).nome||"",uf:(e.estado||{}).sigla||"",cep:String(e.cep||"").replace(/\D/g,""),tel:e.ddd1&&e.telefone1?e.ddd1+e.telefone1:"",email:e.email||""};};

 "Se precisa de acompanhante, alimentação e água":{lbl:"Acompanhante e cuidados",q:"Precisa de acompanhante, alimentação e água durante a viagem?",t:"text"}
};

const GRUPOS_BASE={merc:{t:"Mercadoria",ic:"box"},vol:{t:"Volumes, peso e medidas",ic:"expand"},emb:{t:"Embarque e prazos",ic:"pin"}};

/* ---------- AUXILIARES ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt=i=>typeof i==="string"?i:i.t;
const vale=(i,op)=>typeof i==="string"||!i.op||i.op===op;
const filtra=(l,op)=>(l||[]).filter(i=>vale(i,op)).map(txt);
const num=v=>{const n=parseFloat(String(v||"").replace(/\./g,"").replace(",","."));return isFinite(n)?n:null;};
const fmtN=(n,d=2)=>n==null?"":n.toLocaleString("pt-BR",{maximumFractionDigits:d});
const fmtData=v=>v?v.split("-").reverse().join("/"):"";
const fmtNcm=v=>{const d=v.replace(/\D/g,"").slice(0,8);return d.length>6?`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}`:d.length>4?`${d.slice(0,4)}.${d.slice(4)}`:d;};

const modNome=()=>F.modal==="ns"?"a definir":(MODAIS[F.modal]||{}).nome||"";

function secoes(){
  const op=F.op||"imp", out=[], g={merc:[],vol:[],emb:[]};
  filtra(BASE.pedir,op).forEach(x=>g[(FS[x]&&FS[x].g)||"emb"].push(x));
  ["merc","vol","emb"].forEach(k=>out.push({k,t:GRUPOS_BASE[k].t,ic:GRUPOS_BASE[k].ic,itens:g[k]}));
  if(F.inc) out.push({k:"inc",t:F.inc==="NS"?"Condição de compra e venda":`Condição ${F.inc}`,ic:"doc",code:F.inc!=="NS"?F.inc:"",itens:F.inc==="NS"?NS_INC:filtra(INC[F.inc][op].pedir,op)});
  if(F.modal) out.push({k:"modal",t:F.modal==="ns"?"Transporte":`Transporte ${MODAIS[F.modal].nome.toLowerCase()}`,ic:F.modal==="ns"?"pin":MODAL_IC[F.modal],itens:F.modal==="ns"?NS_MOD:filtra(MODAL_ITENS[F.modal].pedir,op)});
  F.cargas.forEach(c=>out.push({k:"c-"+c,t:CARGAS[c].nome,ic:CARGA_IC[c],itens:filtra(CARGAS[c].pedir,op)}));
  out.push({k:"br",t:op==="imp"?"Importação no Brasil":"Exportação no Brasil",ic:"br",itens:filtra(BRASIL[op].pedir,op)});
  const vistos=new Set(), pular=new Set(F.modal==="maritimo"?["Porto de embarque","Porto de destino"]:[]);
  out.forEach(s=>s.itens=s.itens.filter(x=>!pular.has(x)&&!vistos.has(x)&&vistos.add(x)));
  return out.filter(s=>s.itens.length);
}
function respondido(x){const v=F.resp[x];if(v==null)return false;if(typeof v==="string")return v.trim()!=="";return Object.values(v).some(y=>String(y||"").trim()!=="");}
function chaveFS(tipo){return Object.keys(FS).find(k=>FS[k].t===tipo&&FS[k].g);}
function cubagem(){
  const m=F.resp["Medidas de cada volume (C × L × A, em cm)"]||{}, p=F.resp["Tipo de embalagem, quantidade de volumes e se são empilháveis"]||{};
  const c=num(m.c),l=num(m.l),a=num(m.a),q=num(p.q); if(!c||!l||!a) return null;
  const un=c*l*a/1e6; return {un,total:q?un*q:null};
}

/* ---------- RENDERIZAÇÃO DOS CAMPOS ---------- */
function radios(i,p,opts,val){return `<div class="rcs">${opts.map(o=>`<label class="rc"><input type="radio" name="r${i}${p}" value="${esc(o)}" data-r="${i}" data-p="${p}"${val===o?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`;}
function inp(i,p,v,ph,o={}){return `<input class="in${o.cls?" "+o.cls:""}" type="${o.tipo||"text"}" data-r="${i}" data-p="${p}" value="${esc(v||"")}" placeholder="${esc(ph||"")}" ${o.extra||""} aria-label="${esc(o.aria||ph||"")}">`;}
function campo(x,i){
  const s=FS[x]||{t:"text"}, q=s.q||x, v=F.resp[x], o=(v&&typeof v==="object")?v:{}, sv=typeof v==="string"?v:"";
  let h="";
  switch(s.t){
    case "radio": h=radios(i,"v",s.opts,sv); break;
    case "doc": h=radios(i,"v",["Vou enviar junto","Ainda não tenho"],sv); break;
    case "descncm": h=`<textarea class="in" data-r="${i}" data-p="d" placeholder="O que é, para que serve, material" aria-label="Descrição da mercadoria">${esc(o.d||"")}</textarea><div class="row2"><label class="sub"><span>NCM ou HS code <small>(se souber)</small></span>${inp(i,"ncm",o.ncm,"0000.00.00",{cls:"mono",extra:'inputmode="numeric" maxlength="10"'})}</label></div>`; break;
    case "money": h=`<div class="row2"><label class="sub">Valor${inp(i,"v",o.v,"Ex.: 25.000,00",{extra:'inputmode="decimal"'})}</label><label class="sub">Moeda<select class="in" data-r="${i}" data-p="m">${["USD","EUR","CNY","BRL","Outra"].map(m=>`<option${(o.m||"USD")===m?" selected":""}>${m}</option>`).join("")}</select></label></div>`; break;
    case "pack": h=`<div class="row2"><label class="sub">Tipo<select class="in" data-r="${i}" data-p="t"><option value="">Escolha</option>${["Caixas","Paletes","Engradados","Big bags","Tambores","Rolos","Sem embalagem","Outra"].map(m=>`<option${o.t===m?" selected":""}>${m}</option>`).join("")}</select></label><label class="sub">Quantidade${inp(i,"q",o.q,"Ex.: 8",{extra:'inputmode="numeric"'})}</label></div><p class="lbl2">Os volumes podem ser empilhados?</p>${radios(i,"e",["Sim","Não","Não sei"],o.e)}`; break;
    case "peso": h=`<div class="row2"><label class="sub">Peso bruto total (kg)${inp(i,"t",o.t,"Ex.: 3.500",{extra:'inputmode="decimal"'})}</label><label class="sub">Peso por volume (kg)${inp(i,"u",o.u,"Ex.: 437",{extra:'inputmode="decimal"'})}</label></div>`; break;
    case "medidas": {const cb=cubagem();h=`<div class="row3"><label class="sub">Comprimento (cm)${inp(i,"c",o.c,"120",{extra:'inputmode="decimal"'})}</label><label class="sub">Largura (cm)${inp(i,"l",o.l,"80",{extra:'inputmode="decimal"'})}</label><label class="sub">Altura (cm)${inp(i,"a",o.a,"100",{extra:'inputmode="decimal"'})}</label></div><p class="calc" id="cub">${cubTxt(cb)}</p><p class="hint">Se os volumes têm medidas diferentes, use as do maior e explique em Observações.</p>`;break;}
    case "date2": h=`<div class="row2"><label class="sub">A carga fica pronta em${inp(i,"p",o.p,"",{tipo:"date"})}</label><label class="sub">Precisa chegar até${inp(i,"c",o.c,"",{tipo:"date"})}</label></div>`; break;
    case "recorr": h=`${radios(i,"t",["Pontual (só este)","Recorrente"],o.t)}<label class="sub" style="margin-top:8px">Se for recorrente, quantos embarques ou contêineres por mês?${inp(i,"q",o.q,"Ex.: 4 contêineres por mês")}</label>`; break;
    case "seguro": h=`${radios(i,"s",["Sim","Não","Quero entender melhor"],o.s)}<label class="sub" style="margin-top:8px">Valor a segurar, se já souber${inp(i,"v",o.v,"Ex.: o valor da invoice + 10%")}</label>`; break;
    case "pair": h=`<div class="row2"><label class="sub">${esc(s.a)}${inp(i,"a",o.a,s.pha)}</label><label class="sub">${esc(s.b)}${inp(i,"b",o.b,s.phb)}</label></div>`; break;
    default: h=inp(i,"v",sv,s.ph||"Sua resposta",{aria:q});
  }
  return `<div class="q-item${respondido(x)?" feito":""}" data-q="${i}"><p class="q-t"><span class="q-dot"></span>${esc(q)}</p>${h}</div>`;
}
function cubTxt(cb){if(!cb)return "Preencha as medidas para calcular a cubagem.";return `Cubagem: <b>${fmtN(cb.un,3)} m³</b> por volume${cb.total!=null?` · <b>${fmtN(cb.total,2)} m³</b> no total`:" · informe a quantidade de volumes para o total"}`;}

}

/* ---------- RESUMO ---------- */
function valorTxt(x){
  const s=FS[x]||{t:"text"}, v=F.resp[x]; if(!respondido(x)) return "";
  if(typeof v==="string") return v.trim();
  switch(s.t){
    case "descncm": return [v.d&&v.d.trim(),v.ncm?`NCM ${v.ncm}`:""].filter(Boolean).join(" · ");
    case "money": return v.v?`${v.m||"USD"} ${v.v}`:"";
    case "pack": return [v.q?`${v.q}`:"",v.t?v.t.toLowerCase():"",v.e==="Sim"?"empilháveis":v.e==="Não"?"não empilháveis":""].filter(Boolean).join(" ").replace(/^(\d+) /,"$1 ");
    case "peso": return [v.t?`${v.t} kg no total`:"",v.u?`${v.u} kg por volume`:""].filter(Boolean).join(" · ");
    case "medidas": {const cb=cubagem();return [v.c&&v.l&&v.a?`${v.c} × ${v.l} × ${v.a} cm`:"",cb&&cb.total!=null?`cubagem total ${fmtN(cb.total,2)} m³`:cb?`${fmtN(cb.un,3)} m³ por volume`:""].filter(Boolean).join(" · ");}
    case "date2": return [v.p?`pronta em ${fmtData(v.p)}`:"",v.c?`chegar até ${fmtData(v.c)}`:""].filter(Boolean).join(" · ");
    case "recorr": return [v.t,v.q].filter(Boolean).join(" · ");
    case "seguro": return [v.s,v.v?`valor: ${v.v}`:""].filter(Boolean).join(" · ");
    case "pair": return [v.a,v.b].filter(Boolean).join(" → ");
  }
  return "";
}
function resumo(canal){
  const W=canal==="wpp", B=s=>W?`*${s}*`:s.toUpperCase(), e=F.emp, L=[];
  const op=F.op==="exp"?"Exportação":"Importação", cargas=F.cargas.map(c=>CARGAS[c].nome).join(", ");
  L.push(B("Solicitação de cotação"),`${op} · Incoterm ${incNome()} · ${F.modal==="ns"?"Modal a definir":modNome()} · ${cargas}`,"");
  L.push(B("Empresa"));
  if(e.empresa)L.push(`Empresa: ${e.empresa}`);
  if(e.cnpj&&e.cnpj.length===14)L.push(`CNPJ: ${fmtCnpj(e.cnpj)}`);
  if(e.cidade)L.push(`Cidade: ${e.cidade}/${e.uf}`);
  if(e.nome)L.push(`Contato: ${e.nome}`);
  if(e.fone)L.push(`WhatsApp: ${e.fone}`);
  if(e.email)L.push(`E-mail: ${e.email}`);
  let pend=0;
  secoes().forEach(s=>{const linhas=[];s.itens.forEach(x=>{const t=valorTxt(x);if(t)linhas.push(`${(FS[x]&&FS[x].lbl)||x}: ${t}`);else pend++;});
    if(linhas.length){L.push("",B(s.t),...linhas);}});
  if(F.obs.trim())L.push("",B("Observações"),F.obs.trim());
  const docs=docsPendentes(); if(docs.length)L.push("",`Vou enviar em anexo: ${docs.join(", ")}.`);
  if(pend)L.push("",`${pend} ${pend===1?"item ficou":"itens ficaram"} em branco para conversarmos.`);
  L.push("","Enviado pela Ficha de cotação da Syndex.");
  return L.join("\n");
}
function assunto(){return `Solicitação de cotação | ${F.op==="exp"?"Exportação":"Importação"} ${incNome()} | ${F.emp.empresa||"cliente"}`;}
function linksEnvio(){
  const t=$("txt"), a=$("enviar"); if(!t||!a) return;
  a.href=F.canal==="wpp"?`https://wa.me/${WPP_SYNDEX}?text=${encodeURIComponent(t.value)}`:`mailto:${EMAIL_SYNDEX}?subject=${encodeURIComponent(assunto())}&body=${encodeURIComponent(t.value)}`;
}
function ajusta(){const t=$("txt");if(!t)return;t.style.height="auto";t.style.height=t.scrollHeight+"px";}

/* ---------- NAVEGAÇÃO ---------- */
function validar(){
  if(passo===1){let ok=true;["empresa","nome"].forEach(k=>{const vazio=!F.emp[k].trim();const er=$("err-"+k),el=$("e-"+k);if(er)er.textContent=vazio?"Preencha este campo.":"";if(el)el.classList.toggle("bad",vazio);if(vazio)ok=false;});
    if(!ok){const f=document.querySelector(".field input.bad");if(f)f.focus();} return ok;}
  if(passo===2&&!F.op) return aviso("Escolha importar ou exportar.");
  if(passo===3&&!F.inc) return aviso("Escolha o Incoterm ou marque \"Ainda não sei\".");
  if(passo===4&&!F.modal) return aviso("Escolha o modal ou marque \"Ainda não sei\".");
  return true;
}
function aviso(m){let el=$("aviso");if(!el){el=document.createElement("p");el.id="aviso";el.className="ferr big";$("stage").appendChild(el);}el.textContent=m;return false;}
function render(foco){
  stepper();
  const telas=[null,telaEmpresa,telaOp,telaInc,telaModal,telaCarga,telaDetalhes,telaEnviar];
  const st=$("stage"); st.innerHTML=telas[passo]();
  const dir=passo>passoAnterior?"fwd":passo<passoAnterior?"back":""; passoAnterior=passo;
  st.classList.remove("fwd","back"); if(dir){void st.offsetWidth; st.classList.add(dir);}
  $("voltar").innerHTML=`${ic("back",16)}Voltar`; $("voltar").classList.toggle("invis",passo===1);
  $("pos").textContent=`Passo ${passo} de ${PASSOS.length} · ${PASSOS[passo-1]}`;
  $("prox").innerHTML=passo===6?`Revisar e enviar${ic("next",16)}`:passo===7?`${ic("reset",16)}Nova ficha`:`Continuar${ic("next",16)}`;
  $("prox").className=passo===7?"btn":"btn pri";
  if(passo===7){ajusta();linksEnvio();}
  if(passo===1&&F.emp.cnpj&&!F.emp.rf){const el=$("e-cnpj");if(el&&cnpjValido(F.emp.cnpj))aoCnpj(el);}
  salvar();
  if(foco) document.querySelector(".wiz").scrollIntoView({block:"start",behavior:"smooth"});
}
function progresso(){
  let t=0,o=0; CAMPOS.forEach(x=>{t++;if(respondido(x))o++;});
  const b=$("pbar"),p=$("ptxt"); if(b)b.style.width=(t?o/t*100:0)+"%"; if(p)p.textContent=`${o} de ${t} respondidas`;
}

/* ---------- CNPJ ---------- */
function aoCnpj(el){
  const raw=soCnpj(el.value); el.value=fmtCnpj(raw); F.emp.cnpj=raw; el.classList.remove("bad"); clearTimeout(tCnpj);
  const st=(c,h)=>{const s=$("st-cnpj");if(s){s.className="fstat "+c;s.innerHTML=h;}};
  if(raw.length<14){st("",raw.length?`${14-raw.length} caracteres faltando`:"");if(!raw){F.emp.rf=null;const b=$("rf-box");if(b)b.innerHTML="";}return;}
  if(!cnpjValido(raw)){el.classList.add("bad");st("err","CNPJ inválido: confira os números.");return;}
  if(raw===ultCnpj&&F.emp.rf){st("ok",`${ic("check",13,2.6)}Empresa encontrada.`);return;}
  st("",`<span class="spin"></span>Consultando a Receita Federal…`);
  tCnpj=setTimeout(async()=>{
    try{
      const rf=await tenta([[`https://brasilapi.com.br/api/cnpj/v1/${raw}`,normBrasil],[`https://publica.cnpj.ws/cnpj/${raw}`,normWs]]);
      if(F.emp.cnpj!==raw) return; ultCnpj=raw; F.emp.rf={razao:rf.razao,situacao:rf.situacao,cidade:rf.cidade,uf:rf.uf};
      const nome=tc(rf.fantasia||rf.razao); F.emp.empresa=nome; const ee=$("e-empresa"); if(ee){ee.value=nome;ee.classList.remove("bad");} const er=$("err-empresa"); if(er)er.textContent="";
      F.emp.cidade=tc(rf.cidade); F.emp.uf=rf.uf;
      const b=$("rf-box"); if(b)b.innerHTML=rfMini(); st("ok",`${ic("check",13,2.6)}Empresa encontrada.`); salvar();
      const n=$("e-nome"); if(n&&!n.value) n.focus();
    }catch(e){
      if(F.emp.cnpj!==raw) return;
      if(e==="nao") st("err","Não encontramos esse CNPJ. Confira o número ou preencha os dados abaixo.");
      else st("","Não conseguimos consultar agora. Preencha os dados abaixo.");
    }
  },350);
}

/* ---------- EVENTOS ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const av=$("aviso"); if(av&&(b.dataset.op||b.dataset.inc||b.dataset.modal)) av.remove();
  if(b.dataset.op){if(F.op!==b.dataset.op){F.op=b.dataset.op;}render();}
  else if(b.dataset.inc){F.inc=b.dataset.inc;render();}
  else if(b.dataset.modal){F.modal=b.dataset.modal;render();}
  else if(b.dataset.carga){const k=b.dataset.carga,ix=F.cargas.indexOf(k);
    if(ix>=0){if(F.cargas.length>1)F.cargas.splice(ix,1);}else F.cargas.push(k);
    F.cargas.sort((a,c)=>ORDEM_CARGAS.indexOf(a)-ORDEM_CARGAS.indexOf(c));render();}
  else if(b.dataset.ir){const n=+b.dataset.ir;if(n<=maxPasso&&n!==passo){passo=n;render(true);}}
  else if(b.dataset.canal){F.canal=b.dataset.canal;render();}
  else if(b.id==="voltar"&&passo>1){passo--;render(true);}
  else if(b.id==="prox"){
    if(passo===7){
      if(b.dataset.conf!=="1"){b.dataset.conf="1";b.innerHTML=`${ic("reset",16)}Toque de novo para apagar e recomeçar`;setTimeout(()=>{if(b.dataset.conf==="1"){b.dataset.conf="";b.innerHTML=`${ic("reset",16)}Nova ficha`;}},4000);return;}
      b.dataset.conf="";F=VAZIO();ultCnpj="";passo=1;maxPasso=1;try{localStorage.removeItem("syndex-ficha-v1")}catch(err){}render(true);return;}
    if(!validar()) return; passo++; maxPasso=Math.max(maxPasso,passo); render(true);}
  else if(b.id==="copiar"){const t=$("txt"),ok=$("okmsg");(async()=>{try{await navigator.clipboard.writeText(t.value);ok.textContent="Resumo copiado.";}catch(err){t.select();let f=false;try{f=document.execCommand("copy")}catch(e2){}ok.textContent=f?"Resumo copiado.":"Selecionamos o texto: use Ctrl+C para copiar.";}setTimeout(()=>ok.textContent="",4000);})();}
  else if(b.id==="tema"){const h=document.documentElement,n=h.getAttribute("data-tema")==="escuro"?"claro":"escuro";h.setAttribute("data-tema",n);try{localStorage.setItem("syndex-guia-tema",n)}catch(err){}rotuloTema();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.e){const k=el.dataset.e;
    if(k==="cnpj"){aoCnpj(el);salvar();return;}
    F.emp[k]=el.value; if(el.value.trim()){el.classList.remove("bad");const er=$("err-"+k);if(er)er.textContent="";} salvar(); return;}
  if(el.id==="obs"){F.obs=el.value;salvar();return;}
  if(el.id==="txt"){ajusta();linksEnvio();return;}
  if(el.dataset.r!==undefined){
    const i=+el.dataset.r, p=el.dataset.p||"v", x=CAMPOS[i], s=FS[x]||{t:"text"};
    if(p==="ncm") el.value=fmtNcm(el.value);
    if(COMPOSTOS.has(s.t)){const o=(F.resp[x]&&typeof F.resp[x]==="object")?F.resp[x]:{};o[p]=el.value;F.resp[x]=o;}else F.resp[x]=el.value;
    const box=document.querySelector(`[data-q="${i}"]`); if(box) box.classList.toggle("feito",respondido(x));
    if(s.t==="medidas"||s.t==="pack"){const c=$("cub");if(c)c.innerHTML=cubTxt(cubagem());}
    progresso(); salvar();
  }
});
document.addEventListener("change",e=>{const el=e.target;if(el.tagName==="SELECT"||el.type==="radio"||el.type==="date"){el.dispatchEvent(new Event("input",{bubbles:true}));}});
window.addEventListener("resize",ajusta);
function rotuloTema(){const e=document.documentElement.getAttribute("data-tema")==="escuro";$("tema").innerHTML=e?`${ic("sun",15)}Tema claro`:`${ic("moon",15)}Tema escuro`;}
rotuloTema(); render();

</script>
